<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rPPG Психометр v4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a12;color:#d1d5db;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.4rem;color:#38bdf8;margin-bottom:2px}
.sub{font-size:.78rem;color:#9ca3af;margin-bottom:12px;text-align:center}
.row{display:flex;gap:16px;max-width:960px;width:100%;flex-wrap:wrap;justify-content:center}
.cam{position:relative;width:380px;height:285px;background:#000;border-radius:10px;overflow:hidden;border:2px solid #1e293b}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.cards{display:flex;flex-direction:column;gap:8px;width:240px}
.cd{background:#111827;border:1px solid #1e293b;padding:10px 14px;border-radius:8px;text-align:center}
.cd .t{font-size:.68rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em}
.cd .v{font-size:2rem;font-weight:800;color:#38bdf8;margin:2px 0;transition:color .4s}
.cd .u{font-size:.68rem;color:#6b7280}
.cd.st .v{color:#f87171}
.cd.hr .v{color:#4ade80}
.cd.cn .v{font-size:1.2rem;color:#fbbf24}
.sb{width:100%;max-width:640px;background:#111827;border:1px solid #1e293b;padding:7px 12px;border-radius:6px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;font-size:.78rem;flex-wrap:wrap;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:5px;transition:.3s}
.dot.ok{background:#22c55e;box-shadow:0 0 6px #22c55e}
.dot.wait{background:#f59e0b;box-shadow:0 0 6px #f59e0b}
.qm{width:110px;height:7px;background:#1e293b;border-radius:3px;overflow:hidden;display:inline-block}
.qf{height:100%;width:0%;transition:width .3s,background .3s;border-radius:3px}
.ch{width:100%;max-width:640px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
canvas.gc{width:100%;height:105px;background:#111827;border:1px solid #1e293b;border-radius:6px}
.ctr{margin-top:10px;display:flex;gap:10px}
button{background:#0284c7;color:#fff;border:none;padding:9px 20px;border-radius:5px;font-weight:600;cursor:pointer;font-size:.85rem;transition:.2s}
button:hover{background:#0369a1}
button.off{background:#dc2626}
button.off:hover{background:#b91c1c}
.tip{margin-top:10px;font-size:.7rem;color:#6b7280;max-width:640px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<h1>🫀 rPPG Психометр v4</h1>
<div class="sub">Бесконтактное измерение пульса · Алгоритм POS · Строгая детекция кожи</div>

<div class="row">
 <div class="cam">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="ov" width="380" height="285"></canvas>
 </div>
 <div class="cards">
  <div class="cd"><div class="t">❤️ Пульс</div><div class="v" id="vBPM">--</div><div class="u">BPM</div></div>
  <div class="cd hr"><div class="t">📊 HRV</div><div class="v" id="vHRV">--</div><div class="u">RMSSD мс</div></div>
  <div class="cd st"><div class="t">🧠 Стресс</div><div class="v" id="vSTR">--</div><div class="u">0–100</div></div>
  <div class="cd cn"><div class="t">📡 Качество</div><div class="v" id="vSNR">--</div><div class="u">SNR дБ</div></div>
 </div>
</div>

<div class="sb">
 <div><span class="dot" id="dot"></span><span id="stTxt">Нажмите Старт</span></div>
 <div>Сигнал: <div class="qm"><div class="qf" id="qBar"></div></div></div>
</div>

<div class="ch">
 <canvas id="cPPG" class="gc"></canvas>
 <canvas id="cSPC" class="gc"></canvas>
</div>

<div class="ctr">
 <button id="bOn">▶ Старт</button>
 <button id="bOff" class="off" style="display:none">⏹ Стоп</button>
</div>

<div class="tip">
💡 Расположите лицо в рамке · Свет спереди · Сидите спокойно · Калибровка 5-8 сек
</div>

<script>
// =========================================================================
//  CONFIG
// =========================================================================
const C = {
 CW: 380, CH: 285,
 ROI: { x: .22, y: .05, w: .56, h: .58 },
 SKIN_MIN_RATIO: .35,
 WIN_SEC: 1.6,
 BUF_SEC: 14,
 FLO: .7, FHI: 3.2,
 FBINS: 160,
 SNR_ENTER: 1.5,
 SNR_EXIT: 0.4,
 MOTION_MAX: 3.5,
 BPM_ALPHA: .18,
 HOLD_SEC: 3,
};

// =========================================================================
//  STATE
// =========================================================================
let on = false, stm = null, raf = null;
let rB=[], gB=[], bB=[], tB=[];
let ppg=[], iBuf=[];
let sBPM=NaN, sHRV=NaN, lastValidBPM=NaN, lastValidTime=0;
let prevR=NaN, prevG=NaN, prevB=NaN;
let fc=0, ft0=0, fps=30;
let signalLocked = false;  // гистерезис

// DOM
const vid=document.getElementById('vid');
const ov=document.getElementById('ov');
const co=ov.getContext('2d');
const bOn=document.getElementById('bOn');
const bOff=document.getElementById('bOff');
const stTxt=document.getElementById('stTxt');
const dot=document.getElementById('dot');
const qBar=document.getElementById('qBar');
const vBPM=document.getElementById('vBPM');
const vHRV=document.getElementById('vHRV');
const vSTR=document.getElementById('vSTR');
const vSNR=document.getElementById('vSNR');

const cPPG=document.getElementById('cPPG');
const xPPG=cPPG.getContext('2d');
const cSPC=document.getElementById('cSPC');
const xSPC=cSPC.getContext('2d');

const hc=document.createElement('canvas');
hc.width=C.CW; hc.height=C.CH;
const hx=hc.getContext('2d',{willReadFrequently:true});

bOn.onclick=start; bOff.onclick=stop;

async function start(){
 try{
  stm=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false});
  vid.srcObject=stm; await vid.play();
  reset(); on=true;
  bOn.style.display='none'; bOff.style.display='';
  stTxt.textContent='Поиск лица...'; dot.className='dot wait';
  ft0=performance.now(); fc=0;
  loop();
 }catch(e){alert('Камера: '+e.message)}
}

function stop(){
 on=false; if(raf)cancelAnimationFrame(raf);
 if(stm)stm.getTracks().forEach(t=>t.stop());
 vid.srcObject=null;
 bOn.style.display=''; bOff.style.display='none';
 stTxt.textContent='Остановлено'; dot.className='dot';
 qBar.style.width='0%';
}

function reset(){
 rB=[];gB=[];bB=[];tB=[];ppg=[];iBuf=[];
 sBPM=NaN;sHRV=NaN;lastValidBPM=NaN;lastValidTime=0;
 prevR=NaN;prevG=NaN;prevB=NaN;
 signalLocked=false;
 vBPM.textContent='--';vHRV.textContent='--';
 vSTR.textContent='--';vSNR.textContent='--';
}

// =========================================================================
//  MAIN LOOP
// =========================================================================
function loop(){
 if(!on)return;
 try{
  const now=performance.now();
  fc++;
  if(now-ft0>1000){fps=fc/((now-ft0)/1000);fc=0;ft0=now}

  hx.drawImage(vid,0,0,C.CW,C.CH);

  const rx=Math.floor(C.CW*C.ROI.x);
  const ry=Math.floor(C.CH*C.ROI.y);
  const rw=Math.floor(C.CW*C.ROI.w);
  const rh=Math.floor(C.CH*C.ROI.h);

  const id=hx.getImageData(rx,ry,rw,rh);
  const sk=skinFilter(id.data);

  drawROI(rx,ry,rw,rh,sk.ok,sk.ratio);

  if(!sk.ok){
   stTxt.textContent='⚠ Лицо не обнаружено — направьте лицо в рамку';
   dot.className='dot';
   qBar.style.width='0%'; qBar.style.background='#ef4444';
   // Показываем удержанный BPM, если был
   showHeldBPM(now);
  } else {
   // Motion check
   if(!isNaN(prevR)){
    const d=Math.max(Math.abs(sk.r-prevR),Math.abs(sk.g-prevG),Math.abs(sk.b-prevB));
    if(d>C.MOTION_MAX){
     prevR=sk.r;prevG=sk.g;prevB=sk.b;
     stTxt.textContent='🔄 Движение — замрите';
     dot.className='dot wait';
     showHeldBPM(now);
     throw 'motion'; // пропускаем кадр
    }
   }
   prevR=sk.r;prevG=sk.g;prevB=sk.b;

   rB.push(sk.r);gB.push(sk.g);bB.push(sk.b);tB.push(now);

   const mx=Math.floor(fps*C.BUF_SEC);
   while(rB.length>mx){rB.shift();gB.shift();bB.shift();tB.shift()}

   const need=Math.floor(fps*3.5);
   if(rB.length>=need){
    runAnalysis(now);
   } else {
    const p=Math.round(rB.length/need*100);
    stTxt.textContent=`Калибровка: ${p}%`;
    dot.className='dot wait';
   }
  }

  if(fc%2===0){drawPPG();drawSpec()}

 }catch(e){
  if(e!=='motion')console.error(e);
 }finally{
  raf=requestAnimationFrame(loop);
 }
}

// =========================================================================
//  СТРОГИЙ ФИЛЬТР КОЖИ (из v2, улучшенный)
// =========================================================================
function skinFilter(px){
 let sr=0,sg=0,sb=0,cnt=0;
 const tot=px.length/4;

 // Обрабатываем каждый 3-й пиксель для скорости
 for(let i=0;i<px.length;i+=12){
  const r=px[i],g=px[i+1],b=px[i+2];

  // --- Этап 1: RGB правила (строгие) ---
  // Кожа: R > G > B (в большинстве случаев)
  // При холодном свете может быть R ≈ G, но R > B всегда
  const rgbOk = r > 60 && g > 40 && b > 20 &&
                r > b + 5 &&
                (r - b) > 15 &&
                Math.abs(r - g) < 80 &&
                (Math.max(r,g,b) - Math.min(r,g,b)) > 12 &&
                r < 250 && g < 250; // Не пересвеченные пиксели

  if(!rgbOk) continue;

  // --- Этап 2: HSV проверка оттенка (Hue) ---
  // Кожа человека: Hue от 0° до 50° (оранжево-жёлтый диапазон)
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  const delta=max-min;
  if(delta<10) continue; // Серые пиксели — не кожа

  let hue=0;
  if(max===r) hue=60*((g-b)/delta % 6);
  else if(max===g) hue=60*((b-r)/delta+2);
  else hue=60*((r-g)/delta+4);
  if(hue<0) hue+=360;

  const sat=max>0?delta/max:0;
  const val=max/255;

  // Кожа: Hue 0-55°, Saturation 0.10-0.75, Value 0.25-0.95
  const hsvOk = (hue<=55 || hue>=340) &&
                sat>=0.08 && sat<=0.78 &&
                val>=0.22 && val<=0.96;

  if(!hsvOk) continue;

  // --- Этап 3: YCbCr проверка ---
  const cb = 128 - 0.169*r - 0.331*g + 0.500*b;
  const cr = 128 + 0.500*r - 0.419*g - 0.081*b;
  const ycbcrOk = cb>=75 && cb<=130 && cr>=130 && cr<=185;

  if(!ycbcrOk) continue;

  // Все 3 этапа пройдены — это кожа
  sr+=r; sg+=g; sb+=b; cnt++;
 }

 const effectiveTotal=tot/3;
 const ratio=cnt/effectiveTotal;

 return {
  ok: ratio >= C.SKIN_MIN_RATIO,
  r: cnt>0?sr/cnt:0,
  g: cnt>0?sg/cnt:0,
  b: cnt>0?sb/cnt:0,
  ratio
 };
}

// =========================================================================
//  POS + АНАЛИЗ
// =========================================================================
function runAnalysis(now){
 const N=rB.length;
 const wl=Math.max(16,Math.floor(fps*C.WIN_SEC));
 const H=new Float64Array(N);

 // POS со скользящим перекрывающимся окном
 const step=Math.max(1,Math.floor(wl/4));
 for(let s=0;s<=N-wl;s+=step){
  let mR=0,mG=0,mB=0;
  for(let j=s;j<s+wl;j++){mR+=rB[j];mG+=gB[j];mB+=bB[j]}
  mR/=wl;mG/=wl;mB/=wl;
  if(mR<1||mG<1||mB<1)continue;

  const S1=new Float64Array(wl);
  const S2=new Float64Array(wl);
  for(let j=0;j<wl;j++){
   const rn=rB[s+j]/mR, gn=gB[s+j]/mG, bn=bB[s+j]/mB;
   S1[j]=gn-bn;
   S2[j]=-2*rn+gn+bn;
  }

  const sd1=arrStd(S1), sd2=arrStd(S2);
  const a=sd2>1e-7?sd1/sd2:0;
  for(let j=0;j<wl;j++) H[s+j]+=S1[j]+a*S2[j];
 }

 // Детренд
 let dt=linearDetrend(H);
 // Полосовой фильтр (скользящее среднее HP + LP)
 dt=bandpass(dt,fps);
 // Z-нормализация
 ppg=zNorm(dt);

 // Welch-подобный спектральный анализ
 welchSpectrum(ppg,fps,now);
}

function arrStd(a){
 let m=0;for(let i=0;i<a.length;i++)m+=a[i];m/=a.length;
 let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-m)**2;
 return Math.sqrt(s/a.length);
}

function linearDetrend(a){
 const n=a.length;const o=new Float64Array(n);
 let sx=0,sy=0,sxy=0,sxx=0;
 for(let i=0;i<n;i++){sx+=i;sy+=a[i];sxy+=i*a[i];sxx+=i*i}
 const d=n*sxx-sx*sx;
 if(Math.abs(d)<1e-10){o.set(a);return o}
 const sl=(n*sxy-sx*sy)/d, ic=(sy-sl*sx)/n;
 for(let i=0;i<n;i++)o[i]=a[i]-(sl*i+ic);
 return o;
}

function bandpass(sig,fs){
 const n=sig.length;
 // HP: убираем частоты ниже 0.6 Гц (скользящая средняя с длинным окном)
 const hpW=Math.max(3,Math.round(fs/C.FLO));
 const trend=movAvg(sig,hpW);
 const hp=new Float64Array(n);
 for(let i=0;i<n;i++) hp[i]=sig[i]-trend[i];

 // LP: убираем частоты выше 3.5 Гц
 const lpW=Math.max(3,Math.round(fs/(C.FHI*2)));
 return movAvg(hp,lpW);
}

function movAvg(a,w){
 const n=a.length;const o=new Float64Array(n);
 const h=Math.floor(w/2);
 // Кумулятивная сумма для O(n)
 const cs=new Float64Array(n+1);
 for(let i=0;i<n;i++) cs[i+1]=cs[i]+a[i];
 for(let i=0;i<n;i++){
  const l=Math.max(0,i-h), r=Math.min(n,i+h+1);
  o[i]=(cs[r]-cs[l])/(r-l);
 }
 return o;
}

function zNorm(a){
 let m=0;for(let i=0;i<a.length;i++)m+=a[i];m/=a.length;
 let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-m)**2;
 const sd=Math.sqrt(s/a.length);
 const o=new Float64Array(a.length);
 if(sd<1e-9)return o;
 for(let i=0;i<a.length;i++)o[i]=(a[i]-m)/sd;
 return o;
}

// =========================================================================
//  WELCH СПЕКТР — усредняем несколько перекрывающихся окон FFT
//  Это даёт гораздо более стабильный спектр, чем одиночный Goertzel
// =========================================================================
let lastFreqs=[], lastPowers=[], lastPeakF=1, lastMaxP=0, lastSNR=0;

function welchSpectrum(sig, fs, now){
 const N=sig.length;
 // Размер сегмента Welch: ~6 секунд
 const segLen=Math.min(N, Math.floor(fs*6));
 const overlap=Math.floor(segLen/2);
 const step=segLen-overlap;

 // Собираем сегменты
 const segs=[];
 for(let s=0;s<=N-segLen;s+=step){
  segs.push(sig.slice(s,s+segLen));
 }
 if(segs.length===0) segs.push(sig.slice(-segLen));

 // Для каждого сегмента считаем спектр через Goertzel, потом усредняем
 const bins=C.FBINS;
 const freqs=new Float64Array(bins);
 const avgP=new Float64Array(bins);

 for(let i=0;i<bins;i++){
  freqs[i]=C.FLO+(C.FHI-C.FLO)*i/(bins-1);
 }

 for(const seg of segs){
  // Применяем окно Ханна
  const windowed=applyHann(seg);
  for(let i=0;i<bins;i++){
   avgP[i]+=goertzel(windowed, freqs[i], fs);
  }
 }

 // Усреднение
 for(let i=0;i<bins;i++) avgP[i]/=segs.length;

 // Поиск пика
 let peakP=0, peakF=1, peakIdx=0;
 for(let i=0;i<bins;i++){
  if(avgP[i]>peakP){peakP=avgP[i];peakF=freqs[i];peakIdx=i}
 }

 // SNR: пик (±0.25 Гц) vs остальное
 const hw=0.25;
 let sigE=0,noiE=0,nS=0,nN=0;
 for(let i=0;i<bins;i++){
  if(Math.abs(freqs[i]-peakF)<=hw){sigE+=avgP[i];nS++}
  else{noiE+=avgP[i];nN++}
 }
 const sigD=nS>0?sigE/nS:0;
 const noiD=nN>0?noiE/nN:1e-12;
 const snr=10*Math.log10(sigD/noiD);

 // Сохраняем для рисования
 lastFreqs=freqs;lastPowers=avgP;lastPeakF=peakF;lastMaxP=peakP;lastSNR=snr;

 // Качество бар
 const qp=Math.min(100,Math.max(0,snr/8*100));
 qBar.style.width=qp+'%';
 qBar.style.background=snr>=C.SNR_ENTER?'#22c55e':snr>=0?'#f59e0b':'#ef4444';

 vSNR.textContent=snr.toFixed(1)+' dB';

 // Гистерезис: вход при SNR_ENTER, выход при SNR_EXIT
 if(!signalLocked && snr>=C.SNR_ENTER) signalLocked=true;
 if(signalLocked && snr<C.SNR_EXIT) signalLocked=false;

 const rawBPM=peakF*60;

 if(signalLocked && rawBPM>=42 && rawBPM<=200){
  // Адаптивное сглаживание
  if(isNaN(sBPM)){
   sBPM=rawBPM;
  } else {
   const jump=Math.abs(rawBPM-sBPM);
   // Чем больше скачок — тем меньше вес нового значения
   const alpha=jump>25?.06:jump>15?.10:jump>8?.15:C.BPM_ALPHA;
   sBPM=sBPM*(1-alpha)+rawBPM*alpha;
  }

  const bpm=Math.round(sBPM);
  lastValidBPM=bpm;
  lastValidTime=now;
  vBPM.textContent=bpm;

  // IBI для HRV
  const ibi=60000/rawBPM;
  iBuf.push(ibi);
  if(iBuf.length>40)iBuf.shift();

  calcHRVStress(bpm);

  stTxt.textContent=`✅ Пульс: ${bpm} BPM · SNR: ${snr.toFixed(1)} dB`;
  dot.className='dot ok';

 } else {
  showHeldBPM(now);
  if(snr>=0){
   stTxt.textContent=`⏳ Слабый сигнал (${snr.toFixed(1)} dB) — замрите`;
   dot.className='dot wait';
  } else {
   stTxt.textContent='⚠ Нет пульсового ритма — замрите, свет спереди';
   dot.className='dot wait';
  }
 }
}

function applyHann(a){
 const n=a.length;
 const o=new Float64Array(n);
 for(let i=0;i<n;i++){
  const w=0.5*(1-Math.cos(2*Math.PI*i/(n-1)));
  o[i]=a[i]*w;
 }
 return o;
}

function goertzel(sig,freq,fs){
 const N=sig.length;
 const k=Math.round(freq*N/fs);
 const w=(2*Math.PI*k)/N;
 const c=2*Math.cos(w);
 let s1=0,s2=0;
 for(let i=0;i<N;i++){const s0=sig[i]+c*s1-s2;s2=s1;s1=s0}
 return Math.abs(s1*s1+s2*s2-c*s1*s2)/(N*N);
}

// =========================================================================
//  Удержание последнего BPM при кратковременных потерях
// =========================================================================
function showHeldBPM(now){
 if(!isNaN(lastValidBPM) && (now-lastValidTime)<C.HOLD_SEC*1000){
  vBPM.textContent=lastValidBPM;
  vBPM.style.opacity='.6';
 } else {
  vBPM.textContent='--';
  vBPM.style.opacity='1';
 }
}

// =========================================================================
//  HRV & СТРЕСС
// =========================================================================
function calcHRVStress(bpm){
 vBPM.style.opacity='1';
 if(iBuf.length<5)return;

 // RMSSD
 let ss=0,cn=0;
 for(let i=1;i<iBuf.length;i++){const d=iBuf[i]-iBuf[i-1];ss+=d*d;cn++}
 const rmssd=Math.sqrt(ss/cn);

 if(isNaN(sHRV))sHRV=rmssd;
 else sHRV=sHRV*.8+rmssd*.2;

 const hrv=Math.round(Math.max(5,Math.min(150,sHRV)));
 vHRV.textContent=hrv;

 // Стресс (BPM-компонент + HRV-компонент)
 let sb;
 if(bpm<=60)sb=5;
 else if(bpm<=70)sb=15;
 else if(bpm<=78)sb=25;
 else if(bpm<=86)sb=40;
 else if(bpm<=95)sb=55;
 else if(bpm<=105)sb=70;
 else sb=85;

 let sh;
 if(hrv>=80)sh=5;
 else if(hrv>=55)sh=20;
 else if(hrv>=40)sh=35;
 else if(hrv>=28)sh=50;
 else if(hrv>=18)sh=70;
 else sh=88;

 vSTR.textContent=Math.round(Math.max(5,Math.min(98,sb*.35+sh*.65)));
}

// =========================================================================
//  РИСОВАНИЕ
// =========================================================================
function drawROI(x,y,w,h,ok,ratio){
 co.clearRect(0,0,C.CW,C.CH);

 // Затемнение вне ROI
 co.fillStyle='rgba(0,0,0,.4)';
 co.fillRect(0,0,C.CW,C.CH);
 co.clearRect(x,y,w,h);

 const cl=ok?'#22c55e':'#ef4444';
 co.strokeStyle=cl;co.lineWidth=2;
 co.strokeRect(x,y,w,h);

 // Угловые маркеры
 const cn=14;
 co.lineWidth=3;co.strokeStyle=cl;
 co.beginPath();co.moveTo(x,y+cn);co.lineTo(x,y);co.lineTo(x+cn,y);co.stroke();
 co.beginPath();co.moveTo(x+w-cn,y);co.lineTo(x+w,y);co.lineTo(x+w,y+cn);co.stroke();
 co.beginPath();co.moveTo(x,y+h-cn);co.lineTo(x,y+h);co.lineTo(x+cn,y+h);co.stroke();
 co.beginPath();co.moveTo(x+w-cn,y+h);co.lineTo(x+w,y+h);co.lineTo(x+w,y+h-cn);co.stroke();

 // Текст
 co.fillStyle=cl;
 co.font='bold 11px sans-serif';
 const pct=Math.round(ratio*100);
 co.fillText(ok?`✓ Кожа ${pct}%`:`✗ Нет кожи (${pct}%)`,x+4,y-5);

 // Пульсирующая точка при захвате
 if(ok && signalLocked && !isNaN(sBPM)){
  const p=Math.sin(performance.now()/1000*(sBPM/60)*Math.PI*2)*.5+.5;
  co.beginPath();co.arc(x+w-16,y+16,6,0,Math.PI*2);
  co.fillStyle=`rgba(239,68,68,${.3+p*.7})`;co.fill();
 }
}

function drawPPG(){
 const can=cPPG;
 const w=can.width=can.clientWidth*2;
 const h=can.height=can.clientHeight*2;
 xPPG.clearRect(0,0,w,h);

 if(ppg.length<4){
  xPPG.fillStyle='#4b5563';xPPG.font='12px sans-serif';
  xPPG.fillText('BVP — ожидание данных...',12,h/2);
  return;
 }

 const show=Math.min(ppg.length,220);
 const sl=ppg.slice(-show);
 let mn=1e9,mx=-1e9;
 for(const v of sl){if(v<mn)mn=v;if(v>mx)mx=v}
 const rng=mx-mn||1;

 // Сетка
 xPPG.strokeStyle='rgba(255,255,255,.04)';xPPG.lineWidth=1;
 for(let y0=0;y0<h;y0+=h/4){xPPG.beginPath();xPPG.moveTo(0,y0);xPPG.lineTo(w,y0);xPPG.stroke()}

 // Волна
 xPPG.beginPath();xPPG.strokeStyle='#38bdf8';xPPG.lineWidth=2;
 xPPG.shadowColor='#38bdf8';xPPG.shadowBlur=3;
 for(let i=0;i<sl.length;i++){
  const px=i/(sl.length-1)*w;
  const py=h-((sl[i]-mn)/rng)*(h*.8)-h*.1;
  i===0?xPPG.moveTo(px,py):xPPG.lineTo(px,py);
 }
 xPPG.stroke();xPPG.shadowBlur=0;

 xPPG.fillStyle='#6b7280';xPPG.font='11px monospace';
 xPPG.fillText('BVP (POS)',8,14);
}

function drawSpec(){
 const can=cSPC;
 const w=can.width=can.clientWidth*2;
 const h=can.height=can.clientHeight*2;
 xSPC.clearRect(0,0,w,h);

 if(!lastFreqs.length)return;

 const pad={l:45,r:12,t:24,b:26};
 const pw=w-pad.l-pad.r;
 const ph=h-pad.t-pad.b;
 const bw=pw/lastFreqs.length;

 for(let i=0;i<lastFreqs.length;i++){
  const nm=lastMaxP>0?lastPowers[i]/lastMaxP:0;
  const bh=nm*ph;
  const bx=pad.l+i*bw;
  const by=pad.t+ph-bh;

  const isPk=Math.abs(lastFreqs[i]-lastPeakF)<.04;
  xSPC.fillStyle=isPk?'#ef4444':`rgba(56,189,248,${.12+nm*.6})`;
  xSPC.fillRect(bx,by,Math.max(bw-1,1),bh);
 }

 // Подписи BPM
 xSPC.fillStyle='#9ca3af';xSPC.font='10px monospace';xSPC.textAlign='center';
 for(let b=60;b<=180;b+=20){
  const f=b/60;
  const px=pad.l+((f-C.FLO)/(C.FHI-C.FLO))*pw;
  xSPC.fillText(b+'',px,h-5);
 }

 // Пик
 const pkX=pad.l+((lastPeakF-C.FLO)/(C.FHI-C.FLO))*pw;
 xSPC.strokeStyle='#ef4444';xSPC.lineWidth=1.5;
 xSPC.setLineDash([4,3]);
 xSPC.beginPath();xSPC.moveTo(pkX,pad.t);xSPC.lineTo(pkX,pad.t+ph);xSPC.stroke();
 xSPC.setLineDash([]);

 xSPC.fillStyle='#ef4444';xSPC.font='bold 12px monospace';
 xSPC.fillText(Math.round(lastPeakF*60)+' BPM',pkX,pad.t-5);

 xSPC.textAlign='left';xSPC.fillStyle='#6b7280';xSPC.font='11px monospace';
 xSPC.fillText(`Welch Spectrum · SNR ${lastSNR.toFixed(1)} dB`,pad.l,16);
}
