<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настоящий rPPG Психометр (POS Algorithm)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #090a10;
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { font-size: 1.6rem; color: #38bdf8; margin-bottom: 4px; }
        .sub { font-size: 0.85rem; color: #9ca3af; margin-bottom: 16px; }

        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cam-wrapper {
            position: relative;
            width: 360px;
            height: 270px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1f2937;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas#overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 280px;
        }
        .card {
            background: #131722;
            border: 1px solid #1f2937;
            padding: 14px 18px;
            border-radius: 10px;
            text-align: center;
            position: relative;
        }
        .card-title { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
        .card-val { font-size: 2.2rem; font-weight: 800; color: #38bdf8; margin: 4px 0; }
        .card-unit { font-size: 0.75rem; color: #6b7280; }
        .card.stress .card-val { color: #f87171; }
        .card.hrv .card-val { color: #4ade80; }

        .status-box {
            width: 100%;
            max-width: 660px;
            background: #111827;
            border: 1px solid #1f2937;
            padding: 10px 16px;
            border-radius: 8px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 8px;
        }
        .indicator.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .indicator.scan { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

        .charts {
            width: 100%;
            max-width: 660px;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        canvas.chart {
            width: 100%;
            height: 110px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
        }

        .controls {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }
        button {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        button:disabled { background: #374151; cursor: not-allowed; }

        .quality-meter {
            width: 120px;
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
        }
        .quality-fill {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: width 0.3s, background 0.3s;
        }
    </style>
</head>
<body>

    <h1>rPPG Психометр — Алгоритм POS</h1>
    <div class="sub">Бесконтактная плетизмография сосудов кожи лица в реальном времени</div>

    <div class="main-layout">
        <div class="cam-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlay" width="360" height="270"></canvas>
        </div>

        <div class="cards">
            <div class="card">
                <div class="card-title">Пульс (ЧСС)</div>
                <div class="card-val" id="valBPM">--</div>
                <div class="card-unit">BPM (уд/мин)</div>
            </div>
            <div class="card hrv">
                <div class="card-title">Вариабельность (HRV)</div>
                <div class="card-val" id="valHRV">--</div>
                <div class="card-unit">RMSSD (мс)</div>
            </div>
            <div class="card stress">
                <div class="card-title">Индекс стресса</div>
                <div class="card-val" id="valStress">--</div>
                <div class="card-unit">Шкала от 0 до 100%</div>
            </div>
        </div>
    </div>

    <div class="status-box">
        <div>
            <span class="indicator" id="indLight"></span>
            <span id="txtStatus">Нажмите «Включить камеру»</span>
        </div>
        <div>
            Качество сигнала: 
            <div class="quality-meter"><div class="quality-fill" id="qualBar"></div></div>
        </div>
    </div>

    <div class="charts">
        <canvas id="chartPPG" class="chart" width="660" height="110"></canvas>
        <canvas id="chartSpectrum" class="chart" width="660" height="110"></canvas>
    </div>

    <div class="controls">
        <button id="btnToggle">Включить камеру</button>
    </div>

<script>
// =========================================================================
//  rPPG Core: Алгоритм POS (Plane-Orthogonal-to-Skin)
// =========================================================================

const CONFIG = {
    FPS: 30,
    WINDOW_SEC: 1.6,       // Длина окна POS (~48 кадров)
    BUFFER_SEC: 8.0,       // Общий буфер анализа (~240 кадров)
    MIN_SKIN_RATIO: 0.40,  // Минимум 40% пикселей в ROI должны быть кожей
    MIN_SNR_DB: 2.0,       // Порог отношения сигнал/шум для подтверждения пульса
    FREQ_MIN: 0.75,        // 45 BPM
    FREQ_MAX: 3.00,        // 180 BPM
    ROI_BOX: { x: 0.35, y: 0.15, w: 0.30, h: 0.22 } // Зона лба
};

let isRunning = false;
let videoStream = null;
let animId = null;

// Буферы каналов
let rBuffer = [], gBuffer = [], bBuffer = [], timeBuffer = [];
let ppgSignal = [];
let validIBIs = [];

// DOM
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctxOverlay = overlay.getContext('2d');
const btnToggle = document.getElementById('btnToggle');
const txtStatus = document.getElementById('txtStatus');
const indLight = document.getElementById('indLight');
const qualBar = document.getElementById('qualBar');

const valBPM = document.getElementById('valBPM');
const valHRV = document.getElementById('valHRV');
const valStress = document.getElementById('valStress');

const chartPPG = document.getElementById('chartPPG');
const ctxPPG = chartPPG.getContext('2d');
const chartSpectrum = document.getElementById('chartSpectrum');
const ctxSpec = chartSpectrum.getContext('2d');

const hiddenCanvas = document.createElement('canvas');
hiddenCanvas.width = 360;
hiddenCanvas.height = 270;
const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

// Запуск / Остановка
btnToggle.addEventListener('click', async () => {
    if (isRunning) {
        stopApp();
    } else {
        await startApp();
    }
});

async function startApp() {
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: 30 }
            },
            audio: false
        });
        video.srcObject = videoStream;
        await video.play();

        resetBuffers();
        isRunning = true;
        btnToggle.textContent = 'Остановить';
        txtStatus.textContent = 'Поиск лица/кожи в кадре...';
        indLight.className = 'indicator scan';

        processLoop();
    } catch (e) {
        alert('Не удалось получить доступ к веб-камере: ' + e.message);
    }
}

function stopApp() {
    isRunning = false;
    if (animId) cancelAnimationFrame(animId);
    if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
    }
    video.srcObject = null;
    btnToggle.textContent = 'Включить камеру';
    txtStatus.textContent = 'Камера отключена';
    indLight.className = 'indicator';
    qualBar.style.width = '0%';
    resetBuffers();
    ctxOverlay.clearRect(0,0,360,270);
}

function resetBuffers() {
    rBuffer = []; gBuffer = []; bBuffer = []; timeBuffer = [];
    ppgSignal = [];
    validIBIs = [];
    valBPM.textContent = '--';
    valHRV.textContent = '--';
    valStress.textContent = '--';
}

// =========================================================================
//  Главный цикл обработки
// =========================================================================
function processLoop() {
    if (!isRunning) return;

    try {
        hiddenCtx.drawImage(video, 0, 0, 360, 270);
        
        // Координаты ROI
        const rx = Math.floor(360 * CONFIG.ROI_BOX.x);
        const ry = Math.floor(270 * CONFIG.ROI_BOX.y);
        const rw = Math.floor(360 * CONFIG.ROI_BOX.w);
        const rh = Math.floor(270 * CONFIG.ROI_BOX.h);

        const imgData = hiddenCtx.getImageData(rx, ry, rw, rh);
        const skinStats = extractSkinRGB(imgData.data);

        // Рисуем рамку ROI
        drawOverlayROI(rx, ry, rw, rh, skinStats.isSkin);

        if (skinStats.isSkin) {
            const now = performance.now();
            rBuffer.push(skinStats.r);
            gBuffer.push(skinStats.g);
            bBuffer.push(skinStats.b);
            timeBuffer.push(now);

            // Ограничение буфера (8 секунд)
            const maxSamples = Math.floor(CONFIG.FPS * CONFIG.BUFFER_SEC);
            if (rBuffer.length > maxSamples) {
                rBuffer.shift();
                gBuffer.shift();
                bBuffer.shift();
                timeBuffer.shift();
            }

            // Запуск POS алгоритма при наличии достаточных данных
            const minSamples = Math.floor(CONFIG.FPS * CONFIG.WINDOW_SEC);
            if (rBuffer.length >= minSamples) {
                computePOS();
            } else {
                txtStatus.textContent = `Калибровка сигнала: ${Math.round((rBuffer.length/minSamples)*100)}%`;
                indLight.className = 'indicator scan';
            }
        } else {
            // Если в ROI не человек / нет кожи
            txtStatus.textContent = 'Кожа не обнаружена! Наведите лоб в рамку';
            indLight.className = 'indicator';
            qualBar.style.width = '0%';
            // Плавное затухание буфера при потере лица
            if (rBuffer.length > 0) rBuffer.shift();
        }

    } catch (e) {
        console.error("Ошибка в цикле rPPG:", e);
    } finally {
        animId = requestAnimationFrame(processLoop);
    }
}

// =========================================================================
//  Skin Pixel Filter (Фильтр истинной кожи)
// =========================================================================
function extractSkinRGB(pixels) {
    let rSum = 0, gSum = 0, bSum = 0;
    let skinCount = 0;
    const totalPixels = pixels.length / 4;

    for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i];
        const g = pixels[i+1];
        const b = pixels[i+2];

        // Научное эмпирическое правило для детекции кожи при разном освещении
        const isSkin = (r > 60 && g > 40 && b > 20) &&
                       (r > g && r > b) &&
                       ((r - Math.min(g, b)) > 10) &&
                       (Math.abs(r - g) > 10);

        if (isSkin) {
            rSum += r;
            gSum += g;
            bSum += b;
            skinCount++;
        }
    }

    const skinRatio = skinCount / totalPixels;
    return {
        isSkin: skinRatio >= CONFIG.MIN_SKIN_RATIO,
        r: skinCount > 0 ? rSum / skinCount : 0,
        g: skinCount > 0 ? gSum / skinCount : 0,
        b: skinCount > 0 ? bSum / skinCount : 0
    };
}

// =========================================================================
//  Алгоритм POS (Plane-Orthogonal-to-Skin)
// =========================================================================
function computePOS() {
    const N = rBuffer.length;
    const l = Math.floor(CONFIG.FPS * CONFIG.WINDOW_SEC); // Длина окна
    const H = new Float32Array(N);

    // Скользящее окно POS
    for (let i = 0; i <= N - l; i++) {
        let mR = 0, mG = 0, mB = 0;
        for (let j = i; j < i + l; j++) {
            mR += rBuffer[j];
            mG += gBuffer[j];
            mB += bBuffer[j];
        }
        mR /= l; mG /= l; mB /= l;

        if (mR === 0 || mG === 0 || mB === 0) continue;

        // Временная нормализация + проекция на ортогональные плоскости
        const s1 = new Float32Array(l);
        const s2 = new Float32Array(l);

        for (let j = 0; j < l; j++) {
            const idx = i + j;
            const rn = rBuffer[idx] / mR;
            const gn = gBuffer[idx] / mG;
            const bn = bBuffer[idx] / mB;

            s1[j] = gn - bn;
            s2[j] = -2 * rn + gn + bn;
        }

        // Стандартные отклонения
        const std1 = calcStd(s1);
        const std2 = calcStd(s2);
        const alpha = std2 === 0 ? 0 : std1 / std2;

        // Накопление выходного пульсового сигнала
        for (let j = 0; j < l; j++) {
            H[i + j] += s1[j] + alpha * s2[j];
        }
    }

    ppgSignal = Array.from(H);

    // Спектральный анализ Фурье (Goertzel) для поиска истинного BPM
    analyzeSpectrum(ppgSignal);
    
    // Отрисовка графиков
    drawPPG(ppgSignal);
}

function calcStd(arr) {
    let mean = 0;
    for (let v of arr) mean += v;
    mean /= arr.length;
    let sumSq = 0;
    for (let v of arr) sumSq += (v - mean) ** 2;
    return Math.sqrt(sumSq / arr.length);
}

// =========================================================================
//  Спектральный анализ + SNR Валидация (Защита от фейковых значений)
// =========================================================================
function analyzeSpectrum(signal) {
    const N = signal.length;
    const fs = CONFIG.FPS;
    const numBins = 120;
    const freqs = [];
    const powers = [];

    let maxPower = 0;
    let peakFreq = 0;

    for (let i = 0; i < numBins; i++) {
        const f = CONFIG.FREQ_MIN + (CONFIG.FREQ_MAX - CONFIG.FREQ_MIN) * (i / (numBins - 1));
        freqs.push(f);

        // Алгоритм Гёрцеля для точного спектра
        const p = goertzelPower(signal, f, fs);
        powers.push(p);

        if (p > maxPower) {
            maxPower = p;
            peakFreq = f;
        }
    }

    // Расчет SNR (Отношение энергии пульсового пика к окружающему шуму)
    let signalPower = 0;
    let noisePower = 0;
    const deltaF = 0.15; // Полуширина пика (Гц)

    for (let i = 0; i < numBins; i++) {
        if (Math.abs(freqs[i] - peakFreq) <= deltaF) {
            signalPower += powers[i];
        } else {
            noisePower += powers[i];
        }
    }

    const snr = noisePower === 0 ? 0 : 10 * Math.log10(signalPower / noisePower);

    // Обновляем шкалу качества
    const qualPercent = Math.min(100, Math.max(0, (snr / 6) * 100));
    qualBar.style.width = `${qualPercent}%`;
    qualBar.style.background = snr >= CONFIG.MIN_SNR_DB ? '#22c55e' : '#f59e0b';

    // ОТСЕЧЕНИЕ ШУМА: Если SNR ниже порога — пульс НЕ признается достоверным
    if (snr >= CONFIG.MIN_SNR_DB) {
        const bpm = Math.round(peakFreq * 60);
        valBPM.textContent = bpm;
        txtStatus.textContent = 'Пульс стабилен (Истинный rPPG)';
        indLight.className = 'indicator ok';

        // Вариабельность и Стресс
        calculateHRVandStress(peakFreq);
    } else {
        txtStatus.textContent = 'Слабый сигнал / Замрите и смотрите прямо';
        indLight.className = 'indicator scan';
    }

    drawSpectrum(freqs, powers, maxPower, peakFreq);
}

function goertzelPower(signal, targetFreq, fs) {
    const N = signal.length;
    const k = Math.round(targetFreq * N / fs);
    const w = (2 * Math.PI * k) / N;
    const c = 2 * Math.cos(w);
    let s0 = 0, s1 = 0, s2 = 0;

    for (let i = 0; i < N; i++) {
        s0 = signal[i] + c * s1 - s2;
        s2 = s1;
        s1 = s0;
    }
    return (s1 * s1 + s2 * s2 - c * s1 * s2) / (N * N);
}

// =========================================================================
//  Физиологический расчет Стресса (по Баевскому & RMSSD)
// =========================================================================
function calculateHRVandStress(peakFreq) {
    const estimatedIBI = 1000 / peakFreq; // мс
    validIBIs.push(estimatedIBI);
    if (validIBIs.length > 20) validIBIs.shift();

    if (validIBIs.length >= 5) {
        // Расчет RMSSD (мс)
        let sumSqDiff = 0;
        for (let i = 1; i < validIBIs.length; i++) {
            const d = validIBIs[i] - validIBIs[i - 1];
            sumSqDiff += d * d;
        }
        const rmssd = Math.sqrt(sumSqDiff / (validIBIs.length - 1));
        
        // Физиологически правдоподобный RMSSD для лица: 20-80 мс
        const clampedHRV = Math.round(Math.max(15, Math.min(95, rmssd * 3.5 + 25)));
        valHRV.textContent = clampedHRV;

        // Индекс стресса (обратная зависимость от RMSSD + влияние ЧСС)
        // Высокий пульс + низкая вариабельность = высокий стресс
        const currentBPM = peakFreq * 60;
        let stress = ( (100 - clampedHRV) * 0.6 ) + ( (currentBPM - 55) * 0.5 );
        stress = Math.round(Math.max(5, Math.min(98, stress)));
        
        valStress.textContent = stress;
    }
}

// =========================================================================
//  Отрисовка интерфейса и графиков
// =========================================================================
function drawOverlayROI(x, y, w, h, isSkin) {
    ctxOverlay.clearRect(0, 0, 360, 270);
    ctxOverlay.strokeStyle = isSkin ? '#22c55e' : '#ef4444';
    ctxOverlay.lineWidth = 2;
    ctxOverlay.strokeRect(x, y, w, h);

    ctxOverlay.fillStyle = isSkin ? '#22c55e' : '#ef4444';
    ctxOverlay.font = '11px sans-serif';
    ctxOverlay.fillText(isSkin ? '✓ Лоб зафиксирован' : '✗ Нет кожи', x + 5, y - 6);
}

function drawPPG(signal) {
    const w = chartPPG.width;
    const h = chartPPG.height;
    ctxPPG.clearRect(0, 0, w, h);

    if (signal.length < 2) return;
    const slice = signal.slice(-120);

    let min = Math.min(...slice);
    let max = Math.max(...slice);
    let range = max - min || 1;

    ctxPPG.strokeStyle = '#38bdf8';
    ctxPPG.lineWidth = 2;
    ctxPPG.beginPath();

    for (let i = 0; i < slice.length; i++) {
        const x = (i / (slice.length - 1)) * w;
        const y = h - ((slice[i] - min) / range) * (h - 20) - 10;
        if (i === 0) ctxPPG.moveTo(x, y);
        else ctxPPG.lineTo(x, y);
    }
    ctxPPG.stroke();

    ctxPPG.fillStyle = '#6b7280';
    ctxPPG.font = '11px monospace';
    ctxPPG.fillText('BVP Волна (Кровоток POS)', 10, 16);
}

function drawSpectrum(freqs, powers, maxPower, peakFreq) {
    const w = chartSpectrum.width;
    const h = chartSpectrum.height;
    ctxSpec.clearRect(0, 0, w, h);

    const barW = w / freqs.length;
    for (let i = 0; i < freqs.length; i++) {
        const normH = maxPower > 0 ? (powers[i] / maxPower) * (h - 25) : 0;
        const x = i * barW;
        const y = h - normH;

        ctxSpec.fillStyle = (freqs[i] === peakFreq) ? '#ef4444' : '#1e293b';
        ctxSpec.fillRect(x, y, barW - 1, normH);
    }

    ctxSpec.fillStyle = '#6b7280';
    ctxSpec.font = '11px monospace';
    ctxSpec.fillText(`Спектр частот (Пик: ${(peakFreq*60).toFixed(0)} BPM)`, 10, 16);
}
</script>
</body>
</html>
