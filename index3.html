<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>rPPG v7 — Dual-ROI CHROM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#080a12;color:#d1d5db;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px;overflow-x:hidden}
h1{font-size:1.2rem;color:#38bdf8}
.sub{font-size:.7rem;color:#6b7280;margin-bottom:8px;text-align:center}
.row{display:flex;gap:10px;max-width:900px;width:100%;flex-wrap:wrap;justify-content:center}
.cam{position:relative;width:340px;height:255px;background:#000;border-radius:8px;overflow:hidden;border:2px solid #1e293b}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.cards{display:flex;flex-direction:column;gap:6px;width:220px}
.cd{background:#111827;border:1px solid #1e293b;padding:7px 10px;border-radius:7px;text-align:center}
.cd .t{font-size:.6rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.03em}
.cd .v{font-size:1.8rem;font-weight:800;color:#38bdf8;margin:1px 0}
.cd .u{font-size:.6rem;color:#6b7280}
.cd.st .v{color:#f87171}.cd.hr .v{color:#4ade80}
.hb{text-align:center;padding:4px}
.heart{font-size:2.4rem;display:inline-block;opacity:.2;transform:scale(1);transition:transform .06s,opacity .06s}
.heart.beat{opacity:1;transform:scale(1.3);filter:drop-shadow(0 0 12px #ef4444)}
.bi{font-size:.65rem;color:#9ca3af;margin-top:1px;min-height:2em}
.sb{width:100%;max-width:580px;background:#111827;border:1px solid #1e293b;padding:5px 10px;border-radius:5px;margin-top:6px;display:flex;align-items:center;justify-content:space-between;font-size:.72rem;flex-wrap:wrap;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:4px}

.qf{height:100%;width:0%;transition:width .3s,background .3s;border-radius:3px}
.ch{width:100%;max-width:580px;margin-top:5px;display:flex;flex-direction:column;gap:4px}

.ctr{margin-top:8px;display:flex;gap:8px}
button{background:#0284c7;color:#fff;border:none;padding:8px 16px;border-radius:5px;font-weight:600;cursor:pointer;font-size:.8rem}
button:hover{background:#0369a1}
button.off{background:#dc2626}
.tip{margin-top:6px;font-size:.62rem;color:#555;max-width:580px;text-align:center;line-height:1.3}
</style>
</head>
<body>
<h1>🫀 rPPG v7 — Dual-ROI CHROM</h1>
<div class="sub">Компенсация автоэкспозиции · Адаптивный детектор · Интерполяция ударов</div>

<div class="row">
 <div class="cam">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="ov" width="340" height="255"></canvas>
 </div>
 <div class="cards">
  <div class="cd"><div class="t">❤️ Пульс</div><div class="v" id="vB">--</div><div class="u">BPM</div></div>
  <div class="cd hb"><span class="heart" id="hrt">❤️</span><div class="bi" id="bi">Ожидание...</div></div>
  <div class="cd hr"><div class="t">HRV (RMSSD)</div><div class="v" id="vH">--</div><div class="u">мс</div></div>
  <div class="cd st"><div class="t">Стресс</div><div class="v" id="vS">--</div><div class="u">0–100</div></div>
 </div>
</div>

<div class="sb">
 <div><span class="dot" id="dot"></span><span id="stT">Старт</span></div>
 <div><div class="qm"><div class="qf" id="qB"></div></div> <span id="fpL" style="color:#555"></span></div>
</div>

<div class="ch">
 <canvas id="cP" class="gc"></canvas>
 <canvas id="cS" class="gc"></canvas>
</div>

<div class="ctr">
 <button id="bOn">▶ Старт</button>
 <button id="bOff" class="off" style="display:none">⏹ Стоп</button>
</div>
<div class="tip">💡 Держите телефон неподвижно · Свет на лицо · Рамка лица + углы (фон) должны быть видны</div>

<script>
// =========================================================================
const W=340, H=255;
// ROI лица (центр)
const FACE={x:.22,y:.10,w:.56,h:.50};
// ROI фона (4 угла)
const BG_ROIS=[
 {x:.02,y:.02,w:.14,h:.14},
 {x:.84,y:.02,w:.14,h:.14},
 {x:.02,y:.84,w:.14,h:.14},
 {x:.84,y:.84,w:.14,h:.14}
];

const BPM_LO=42, BPM_HI=190;
const BUF_SEC=15;
const FLO=.7, FHI=3.2;
const IBI_MIN=315, IBI_MAX=1430; // 190-42 BPM в мс
const IBI_ARTIFACT_RATIO=.65;  // < 65% медианы = артефакт
const IBI_MISS_RATIO=1.45;     // > 145% медианы = пропуск
const Z_THRESH=1.0;             // z-score порог для пика
const PEAK_COOLDOWN_MS=350;

let on=false,stm=null,raf=null;
let rawSig=[],rawT=[];
let filtSig=[];
let sBPM=NaN,sHRV=NaN,lastVBPM=NaN,lastVT=0;
let fc=0,ft0=0,fps=25;
let pSkinR=NaN;
let realIBIs=[],beatTs=[];
let hrtTmr=null;
// IIR
let iirHP={x1:0,x2:0,y1:0,y2:0},iirLP={x1:0,x2:0,y1:0,y2:0};
let iirCoeffsHP=null,iirCoeffsLP=null,iirOk=false;
// Z-score detector state
let zMean=0,zStd=1,zN=0;
let lastPkT=0;
// Spectrum
let spF=[],spP=[],spPkF=1,spMax=0,spSNR=0,lastSpT=0;
// Interpolation stats
let interpCount=0,artifCount=0;

const vid=document.getElementById('vid');
const ov=document.getElementById('ov');
const co=ov.getContext('2d');
const bOn=document.getElementById('bOn'),bOff=document.getElementById('bOff');
const stT=document.getElementById('stT'),dot=document.getElementById('dot');
const qB=document.getElementById('qB'),fpL=document.getElementById('fpL');
const vB=document.getElementById('vB'),vH=document.getElementById('vH'),vS=document.getElementById('vS');
const hrt=document.getElementById('hrt'),bi=document.getElementById('bi');
const cP=document.getElementById('cP'),xP=cP.getContext('2d');
const cS=document.getElementById('cS'),xS=cS.getContext('2d');
const hc=document.createElement('canvas');hc.width=W;hc.height=H;
const hx=hc.getContext('2d',{willReadFrequently:true});

bOn.onclick=startApp;bOff.onclick=stopApp;

async function startApp(){
 try{
  stm=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  vid.srcObject=stm;await vid.play();
  resetAll();on=true;
  bOn.style.display='none';bOff.style.display='';
  ft0=performance.now();fc=0;loop();
 }catch(e){alert('Камера: '+e.message)}
}
function stopApp(){
 on=false;if(raf)cancelAnimationFrame(raf);
 if(stm)stm.getTracks().forEach(t=>t.stop());
 vid.srcObject=null;bOn.style.display='';bOff.style.display='none';
 stT.textContent='Стоп';dot.className='dot';qB.style.width='0%';
}
function resetAll(){
 rawSig=[];rawT=[];filtSig=[];
 sBPM=NaN;sHRV=NaN;lastVBPM=NaN;lastVT=0;
 pSkinR=NaN;realIBIs=[];beatTs=[];
 zMean=0;zStd=1;zN=0;lastPkT=0;
 spF=[];spP=[];lastSpT=0;
 iirOk=false;interpCount=0;artifCount=0;
 vB.textContent='--';vH.textContent='--';vS.textContent='--';
 bi.textContent='Ожидание...';
}

// =========================================================================
//  IIR BUTTERWORTH 2nd ORDER
// =========================================================================
function makeIIR(fc,fs,type){
 const w0=Math.tan(Math.PI*fc/fs),w2=w0*w0,sq=Math.SQRT2;
 const k=1+sq*w0+w2;
 if(type==='hp'){
  return{b0:1/k,b1:-2/k,b2:1/k,a1:2*(w2-1)/k,a2:(1-sq*w0+w2)/k};
 }else{
  return{b0:w2/k,b1:2*w2/k,b2:w2/k,a1:2*(w2-1)/k,a2:(1-sq*w0+w2)/k};
 }
}
function iir(x,st,c){
 const y=c.b0*x+c.b1*st.x1+c.b2*st.x2-c.a1*st.y1-c.a2*st.y2;
 st.x2=st.x1;st.x1=x;st.y2=st.y1;st.y1=y;return y;
}
function ensureIIR(){
 if(!iirOk||!iirCoeffsHP){
  iirCoeffsHP=makeIIR(FLO,fps,'hp');
  iirCoeffsLP=makeIIR(FHI,fps,'lp');
  iirHP={x1:0,x2:0,y1:0,y2:0};
  iirLP={x1:0,x2:0,y1:0,y2:0};
  iirOk=true;
 }
}

// =========================================================================
//  ИЗВЛЕЧЕНИЕ КОЖИ И ФОНА
// =========================================================================
function getROI(px,w,h,roi){
 const rx=Math.floor(w*roi.x),ry=Math.floor(h*roi.y);
 const rw=Math.floor(w*roi.w),rh=Math.floor(h*roi.h);
 let sr=0,sg=0,sb=0,cnt=0;
 for(let y=ry;y<ry+rh;y++){
  for(let x=rx;x<rx+rw;x++){
   const i=(y*w+x)*4;
   sr+=px[i];sg+=px[i+1];sb+=px[i+2];cnt++;
  }
 }
 return cnt>0?{r:sr/cnt,g:sg/cnt,b:sb/cnt}:null;
}

function getSkinROI(px,w,h,roi){
 const rx=Math.floor(w*roi.x),ry=Math.floor(h*roi.y);
 const rw=Math.floor(w*roi.w),rh=Math.floor(h*roi.h);
 let sr=0,sg=0,sb=0,cnt=0;
 // Шаг 3 для скорости
 for(let y=ry;y<ry+rh;y+=2){
  for(let x=rx;x<rx+rw;x+=2){
   const i=(y*w+x)*4;
   const r=px[i],g=px[i+1],b=px[i+2];
   // Быстрый фильтр кожи
   if(r>50&&g>30&&b>15&&r>b+3&&(r-b)>10&&r<252){
    const max=Math.max(r,g,b),min=Math.min(r,g,b);
    if(max-min>6){
     sr+=r;sg+=g;sb+=b;cnt++;
    }
   }
  }
 }
 const total=Math.floor(rw/2)*Math.floor(rh/2);
 return{r:cnt>0?sr/cnt:0,g:cnt>0?sg/cnt:0,b:cnt>0?sb/cnt:0,ok:cnt/total>.25,ratio:cnt/total};
}

// =========================================================================
//  CHROM АЛГОРИТМ (de Haan & Jeanne 2013)
//  Более устойчив к освещению, чем POS
// =========================================================================
function chromSignal(rn,gn,bn){
 // Нормализованные каналы (уже поделены на фон)
 const Xs = 3*rn - 2*gn;
 const Ys = 1.5*rn + gn - 1.5*bn;
 return {xs:Xs, ys:Ys};
}

// =========================================================================
//  ГЛАВНЫЙ ЦИКЛ
// =========================================================================
function loop(){
 if(!on)return;
 try{
  const now=performance.now();
  fc++;
  if(now-ft0>1000){
   fps=Math.max(8,fc/((now-ft0)/1000));
   fc=0;ft0=now;
   fpL.textContent=fps.toFixed(0)+'fps';
   iirOk=false; // пересчитать коэффициенты при изменении FPS
  }
  ensureIIR();

  hx.drawImage(vid,0,0,W,H);
  const imgData=hx.getImageData(0,0,W,H);
  const px=imgData.data;

  // Извлекаем фон (среднее по 4 углам)
  let bgR=0,bgG=0,bgB=0,bgN=0;
  for(const roi of BG_ROIS){
   const bg=getROI(px,W,H,roi);
   if(bg&&bg.r>5){bgR+=bg.r;bgG+=bg.g;bgB+=bg.b;bgN++}
  }
  if(bgN>0){bgR/=bgN;bgG/=bgN;bgB/=bgN}
  else{bgR=128;bgG=128;bgB=128} // fallback

  // Извлекаем кожу лица
  const skin=getSkinROI(px,W,H,FACE);

  // Рисуем ROI
  drawROI(skin.ok,skin.ratio,bgN>0);

  if(!skin.ok){
   stT.textContent='⚠ Лицо не найдено';dot.className='dot';
   qB.style.width='0%';qB.style.background='#ef4444';
   showHeld(now);
  }else{
   // Motion check (по коже)
   if(!isNaN(pSkinR)){
    const d=Math.abs(skin.r-pSkinR);
    if(d>5){pSkinR=skin.r;stT.textContent='🔄 Движение...';dot.className='dot w';showHeld(now);throw'skip'}
   }
   pSkinR=skin.r;

   // DUAL-ROI НОРМАЛИЗАЦИЯ: делим кожу на фон
   // Это компенсирует автоэкспозицию!
   const rn = bgR>5 ? skin.r/bgR : 1;
   const gn = bgG>5 ? skin.g/bgG : 1;
   const bn = bgB>5 ? skin.b/bgB : 1;

   // CHROM
   const ch = chromSignal(rn, gn, bn);
   // Используем Xs - alpha*Ys, где alpha адаптивно
   // Для инкрементального режима alpha ≈ 1 (упрощение)
   const sample = ch.xs - ch.ys;

   rawSig.push(sample);
   rawT.push(now);
   const mx=Math.floor(fps*BUF_SEC);
   while(rawSig.length>mx){rawSig.shift();rawT.shift()}

   // IIR полосовой фильтр (инкрементально)
   const hp=iir(sample,iirHP,iirCoeffsHP);
   const bp=iir(hp,iirLP,iirCoeffsLP);
   filtSig.push(bp);
   if(filtSig.length>mx){filtSig.shift()}

   // Z-SCORE ПИКОВЫЙ ДЕТЕКТОР
   detectPeakZScore(bp,now);

   // BPM
   updateBPM(now);

   // Спектр (раз в 2.5 сек)
   if(now-lastSpT>2500&&filtSig.length>fps*3){lastSpT=now;computeSpectrum()}
  }

  if(fc%2===0){drawPPG(now);drawSpec()}

 }catch(e){if(e!=='skip')console.error(e)}
 finally{raf=requestAnimationFrame(loop)}
}

// =========================================================================
//  Z-SCORE ПИКОВЫЙ ДЕТЕКТОР
//  Адаптивный: следит за локальным средним и std
// =========================================================================
function detectPeakZScore(val,now){
 // Прогрев фильтра (первые 2 сек)
 if(filtSig.length < fps*2) {
  zMean=val; zStd=Math.abs(val)||1; zN++;
  return;
 }

 // Скользящее среднее и std (экспоненциальное)
 const a=0.015; // медленная адаптация
 zMean=zMean*(1-a)+val*a;
 const dev=val-zMean;
 zStd=zStd*(1-a)+Math.abs(dev)*a;
 if(zStd<1e-6)zStd=1e-6;

 const z=dev/zStd;

 // Пик: z-score выше порога И прошло достаточно времени с последнего пика
 if(z > Z_THRESH && (now-lastPkT) > PEAK_COOLDOWN_MS){
  // Дополнительная проверка: это локальный максимум?
  const n=filtSig.length;
  if(n>=3){
   const v0=filtSig[n-3],v1=filtSig[n-2],v2=filtSig[n-1];
   if(v1>v0 && v1>=v2){
    registerBeat(now);
   }
  }
 }
}

function registerBeat(t){
 // Артефакт-фильтр: если IBI слишком короткий — пропускаем
 if(lastPkT>0){
  const ibi=t-lastPkT;
  if(ibi<IBI_MIN)return; // слишком рано — артефакт

  // Интерполяция: если IBI слишком длинный — вставляем пропущенные удары
  if(realIBIs.length>=3){
   const medIBI=medianIBI();
   if(medIBI>0 && ibi>medIBI*IBI_MISS_RATIO){
    // Сколько ударов пропущено?
    const missed=Math.round(ibi/medIBI)-1;
    for(let m=1;m<=missed&&m<=3;m++){
     const interpT=lastPkT+medIBI*m;
     const interpIBI=m===1?(interpT-lastPkT):medIBI;
     if(interpIBI>=IBI_MIN&&interpIBI<=IBI_MAX){
      realIBIs.push(interpIBI);
      beatTs.push(interpT);
      interpCount++;
     }
    }
   }
  }

  if(ibi>=IBI_MIN&&ibi<=IBI_MAX){
   realIBIs.push(ibi);
   if(realIBIs.length>60)realIBIs.shift();
  }
 }

 lastPkT=t;
 beatTs.push(t);
 while(beatTs.length>0&&t-beatTs[0]>30000)beatTs.shift();

 // Heart animation
 hrt.classList.add('beat');
 if(hrtTmr)clearTimeout(hrtTmr);
 hrtTmr=setTimeout(()=>hrt.classList.remove('beat'),160);

 if(realIBIs.length>=1){
  const last=realIBIs[realIBIs.length-1];
  bi.textContent=`💓 ${Math.round(last)}мс → ${Math.round(60000/last)} BPM`;
 }
}

function medianIBI(){
 if(realIBIs.length<3)return 0;
 const s=[...realIBIs.slice(-15)].sort((a,b)=>a-b);
 return s[Math.floor(s.length/2)];
}

// =========================================================================
//  BPM & HRV
// =========================================================================
function updateBPM(now){
 if(realIBIs.length<3){
  stT.textContent=`Калибровка (${realIBIs.length} ударов)...`;
  dot.className='dot w';return;
 }

 // Чистка артефактов: удаляем IBI < 65% медианы
 const med=medianIBI();
 if(med>0){
  const clean=realIBIs.filter(i=>i>=med*IBI_ARTIFACT_RATIO&&i<=med/IBI_ARTIFACT_RATIO);
  if(clean.length>=3){
   // Trimmed mean
   const s=[...clean].sort((a,b)=>a-b);
   const trim=Math.max(1,Math.floor(s.length*.15));
   const t=s.slice(trim,-trim||s.length);
   const avg=t.reduce((a,b)=>a+b,0)/t.length;
   const peakBPM=60000/avg;

   if(peakBPM>=BPM_LO&&peakBPM<=BPM_HI){
    if(isNaN(sBPM))sBPM=peakBPM;
    else{
     const j=Math.abs(peakBPM-sBPM);
     const a=j>15?.05:j>8?.09:j>4?.14:.08;
     sBPM=sBPM*(1-a)+peakBPM*a;
    }
    const bpm=Math.round(sBPM);
    lastVBPM=bpm;lastVT=now;
    vB.textContent=bpm;vB.style.opacity='1';

    const b10=beatTs.filter(t=>now-t<10000).length;
    stT.textContent=`✅ ${bpm} BPM · ${b10}/10с · I:${interpCount} A:${artifCount}`;
    dot.className='dot ok';

    calcHRV(bpm);
    return;
   }
  }
 }
 showHeld(now);
}

function calcHRV(bpm){
 if(realIBIs.length<5)return;
 const med=medianIBI();
 const clean=realIBIs.filter(i=>i>=med*.7&&i<=med*1.3).slice(-25);
 if(clean.length<5)return;
 let ss=0,cn=0;
 for(let i=1;i<clean.length;i++){const d=clean[i]-clean[i-1];ss+=d*d;cn++}
 if(!cn)return;
 const rmssd=Math.sqrt(ss/cn);
 if(isNaN(sHRV))sHRV=rmssd;else sHRV=sHRV*.85+rmssd*.15;
 const hrv=Math.round(Math.max(5,Math.min(180,sHRV)));
 vH.textContent=hrv;

 let sb;
 if(bpm<=60)sb=5;else if(bpm<=70)sb=15;else if(bpm<=78)sb=25;
 else if(bpm<=86)sb=38;else if(bpm<=95)sb=52;else if(bpm<=105)sb=68;else sb=85;
 let sh;
 if(hrv>=80)sh=5;else if(hrv>=55)sh=18;else if(hrv>=40)sh=32;
 else if(hrv>=28)sh=48;else if(hrv>=18)sh=65;else sh=88;
 vS.textContent=Math.round(Math.max(5,Math.min(98,sb*.35+sh*.65)));
}

function showHeld(now){
 if(!isNaN(lastVBPM)&&(now-lastVT)<4000){vB.textContent=lastVBPM;vB.style.opacity='.5'}
 else{vB.textContent='--';vB.style.opacity='1'}
}

// =========================================================================
//  СПЕКТР
// =========================================================================
function computeSpectrum(){
 const sig=filtSig,N=sig.length;if(N<60)return;
 const bins=160,freqs=new Float64Array(bins),pow=new Float64Array(bins);
 for(let i=0;i<bins;i++)freqs[i]=FLO+(FHI-FLO)*i/(bins-1);
 const segLen=Math.min(N,Math.floor(fps*5));
 const segs=N>=segLen*1.5?[sig.slice(0,segLen),sig.slice(-segLen)]:[sig.slice(-segLen)];
 for(const seg of segs){
  const w=hann(seg);
  for(let i=0;i<bins;i++)pow[i]+=goertzel(w,freqs[i],fps);
 }
 for(let i=0;i<bins;i++)pow[i]/=segs.length;
 let pkI=0,pkP=0;
 for(let i=0;i<bins;i++){if(pow[i]>pkP){pkP=pow[i];pkI=i}}
 let pF=freqs[pkI];
 if(pkI>0&&pkI<bins-1){
  const a=pow[pkI-1],b=pow[pkI],c=pow[pkI+1],d=a-2*b+c;
  if(Math.abs(d)>1e-12)pF=freqs[pkI]+.5*(a-c)/d*(freqs[1]-freqs[0]);
 }
 const hw=.2;let sE=0,nE=0,nS=0,nN=0;
 for(let i=0;i<bins;i++){
  if(Math.abs(freqs[i]-pF)<=hw){sE+=pow[i];nS++}else{nE+=pow[i];nN++}
 }
 const snr=10*Math.log10((nS?sE/nS:0)/(nN?nE/nN:1e-12));
 spF=freqs;spP=pow;spPkF=pF;spMax=pkP;spSNR=snr;
 const qp=Math.min(100,Math.max(0,snr/6*100));
 qB.style.width=qp+'%';qB.style.background=snr>=1?'#22c55e':snr>=0?'#f59e0b':'#ef4444';
}
function hann(a){const n=a.length,o=new Float64Array(n);for(let i=0;i<n;i++)o[i]=a[i]*.5*(1-Math.cos(2*Math.PI*i/(n-1)));return o}
function goertzel(s,f,fs){const N=s.length,k=Math.round(f*N/fs),w=2*Math.PI*k/N,c=2*Math.cos(w);let s1=0,s2=0;for(let i=0;i<N;i++){const s0=s[i]+c*s1-s2;s2=s1;s1=s0}return Math.abs(s1*s1+s2*s2-c*s1*s2)/(N*N)}

//  РИСОВАНИЕ
// =========================================================================
function drawROI(skinOk,ratio,bgOk){
 co.clearRect(0,0,W,H);
 co.fillStyle='rgba(0,0,0,.3)';co.fillRect(0,0,W,H);
 // Лицо
 const fx=Math.floor(W*FACE.x),fy=Math.floor(H*FACE.y);
 const fw=Math.floor(W*FACE.w),fh=Math.floor(H*FACE.h);
 co.clearRect(fx,fy,fw,fh);
 co.strokeStyle=skinOk?'#22c55e':'#ef4444';co.lineWidth=2;co.strokeRect(fx,fy,fw,fh);
 // Фон (углы)
 co.strokeStyle=bgOk?'rgba(56,189,248,.5)':'rgba(239,68,68,.3)';co.lineWidth=1;co.setLineDash([3,3]);
 for(const r of BG_ROIS){
  const bx=Math.floor(W*r.x),by=Math.floor(H*r.y);
  const bw=Math.floor(W*r.w),bh=Math.floor(H*r.h);
  co.clearRect(bx,by,bw,bh);
  co.strokeRect(bx,by,bw,bh);
 }
 co.setLineDash([]);
 // Подписи
 co.font='bold 10px sans-serif';
 co.fillStyle=skinOk?'#22c55e':'#ef4444';
 co.fillText(skinOk?`✓ Лицо ${Math.round(ratio*100)}%`:'✗ Нет лица',fx+3,fy-4);
 co.fillStyle='rgba(56,189,248,.6)';
 co.fillText('фон',Math.floor(W*BG_ROIS[0].x)+2,Math.floor(H*BG_ROIS[0].y)-2);
}

function drawPPG(now){
 const w=cP.width=cP.clientWidth*2,h=cP.height=cP.clientHeight*2;
 xP.clearRect(0,0,w,h);
 if(filtSig.length<4){xP.fillStyle='#4b5563';xP.font='11px sans-serif';xP.fillText('Ожидание...',10,h/2);return}
 const show=Math.min(filtSig.length,Math.floor(fps*6));
 const sl=filtSig.slice(-show);
 let mn=1e9,mx=-1e9;for(const v of sl){if(v<mn)mn=v;if(v>mx)mx=v}
 const rng=mx-mn||1;

 xP.strokeStyle='rgba(255,255,255,.03)';xP.lineWidth=1;
 for(let y0=0;y0<h;y0+=h/4){xP.beginPath();xP.moveTo(0,y0);xP.lineTo(w,y0);xP.stroke()}

 // Порог z-score
 const thrVal=zMean+zStd*Z_THRESH;
 const thrY=h-((thrVal-mn)/rng)*(h*.75)-h*.12;
 if(thrY>5&&thrY<h-5){
  xP.strokeStyle='rgba(239,68,68,.15)';xP.setLineDash([3,3]);
  xP.beginPath();xP.moveTo(0,thrY);xP.lineTo(w,thrY);xP.stroke();xP.setLineDash([]);
 }

 // Волна
 xP.beginPath();xP.strokeStyle='#38bdf8';xP.lineWidth=2;
 for(let i=0;i<sl.length;i++){
  const px=i/(sl.length-1)*w;
  const py=h-((sl[i]-mn)/rng)*(h*.75)-h*.12;
  i===0?xP.moveTo(px,py):xP.lineTo(px,py);
 }
 xP.stroke();

 // Удары
 const tStart=rawT.length>show?rawT[rawT.length-show]:(rawT[0]||0);
 const tEnd=rawT[rawT.length-1]||now;
 const tR=tEnd-tStart||1;
 xP.fillStyle='#ef4444';
 for(const bt of beatTs){
  if(bt<tStart||bt>tEnd)continue;
  const px=((bt-tStart)/tR)*w;
  xP.globalAlpha=.25;xP.fillRect(px-1,0,2,h);xP.globalAlpha=1;
  xP.beginPath();xP.arc(px,8,3,0,Math.PI*2);xP.fill();
 }

 xP.fillStyle='#555';xP.font='10px monospace';
 xP.fillText(`CHROM · Dual-ROI · z-score детектор`,6,h-4);
}

function drawSpec(){
 const w=cS.width=cS.clientWidth*2,h=cS.height=cS.clientHeight*2;
 xS.clearRect(0,0,w,h);
 if(!spF.length){xS.fillStyle='#4b5563';xS.font='11px sans-serif';xS.fillText('Спектр...',10,h/2);return}
 const p={l:38,r:10,t:20,b:22},pw=w-p.l-p.r,ph=h-p.t-p.b;
 const bw=pw/spF.length;
 for(let i=0;i<spF.length;i++){
  const nm=spMax>0?spP[i]/spMax:0;const bh=nm*ph;
  xS.fillStyle=Math.abs(spF[i]-spPkF)<.04?'#ef4444':`rgba(56,189,248,${.08+nm*.5})`;
  xS.fillRect(p.l+i*bw,p.t+ph-bh,Math.max(bw-1,1),bh);
 }
 xS.fillStyle='#9ca3af';xS.font='9px monospace';xS.textAlign='center';
 for(let b=60;b<=180;b+=30){
  const f=b/60,px=p.l+((f-FLO)/(FHI-FLO))*pw;
  xS.fillText(b+'',px,h-3);
 }
 const pkX=p.l+((spPkF-FLO)/(FHI-FLO))*pw;
 xS.strokeStyle='#ef4444';xS.lineWidth=1;xS.setLineDash([3,3]);
 xS.beginPath();xS.moveTo(pkX,p.t);xS.lineTo(pkX,p.t+ph);xS.stroke();xS.setLineDash([]);
 xS.fillStyle='#ef4444';xS.font='bold 11px monospace';
 xS.fillText(Math.round(spPkF*60)+' BPM',pkX,p.t-3);
 xS.textAlign='left';xS.fillStyle='#555';xS.font='10px monospace';
 xS.fillText(`SNR ${spSNR.toFixed(1)}dB`,p.l,13);
}
