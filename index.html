<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Психометр v6</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a0a0f; color:#e0e0e0;
            font-family:'Courier New',monospace;
            min-height:100vh; overflow-x:hidden;
        }
        .header {
            background:#0f0f1a; padding:10px 16px;
            border-bottom:1px solid #1a1a2e;
            display:flex; align-items:center; justify-content:space-between;
        }
        .header h1 { font-size:14px; color:#00ff88; letter-spacing:2px; }

        .video-wrap {
            position:relative; width:100%; height:220px;
            background:#000; overflow:hidden;
        }
        #videoEl {
            width:100%; height:220px;
            object-fit:cover; display:block;
        }
        #drawCanvas {
            position:absolute; top:0; left:0;
            width:100%; height:220px; pointer-events:none;
        }

        .controls {
            padding:8px 16px; display:flex; gap:8px;
            background:#0f0f1a; border-bottom:1px solid #1a1a2e;
        }
        button {
            padding:9px 10px; border:1px solid #333;
            border-radius:6px; background:#1a1a2e; color:#e0e0e0;
            font-family:'Courier New',monospace; font-size:12px;
            cursor:pointer; flex:1;
        }
        button.primary { border-color:#00ff88; color:#00ff88; }
        button.danger  { border-color:#ff3333; color:#ff3333; }
        button:disabled { opacity:0.4; }

        .status-banner {
            padding:9px 16px; font-size:12px; font-weight:bold;
            text-align:center; border-bottom:2px solid #111;
            transition:background 0.4s,color 0.4s;
        }
        .sb-idle    { background:#0f0f1a; color:#555; }
        .sb-loading { background:#0a0a1a; color:#4488ff; }
        .sb-calib   { background:#1a1400; color:#ff9900; }
        .sb-noface  { background:#1a0800; color:#ff6600; }
        .sb-weak    { background:#180808; color:#ff5555; }
        .sb-confirm { background:#0a1a0a; color:#88ff88; }
        .sb-valid   { background:#051505; color:#00ff88; font-size:14px; }

        .prog-wrap { height:4px; background:#111; }
        .prog-fill { height:100%; background:#ff9900; transition:width 0.3s; width:0%; }
        .prog-fill.ok { background:#00ff88; }

        /* Диагностика */
        .diag {
            display:grid; grid-template-columns:repeat(4,1fr);
            gap:1px; background:#111; border-bottom:1px solid #1a1a2e;
        }
        .dc { background:#0c0c14; padding:6px 4px; text-align:center; }
        .dn { font-size:9px; color:#555; text-transform:uppercase; letter-spacing:1px; }
        .dv { font-size:13px; font-weight:bold; color:#888; margin-top:2px; }
        .dv.g { color:#00ff88; } .dv.y { color:#ff9900; } .dv.r { color:#ff3333; }

        /* Пульс */
        .hr-display {
            padding:14px 16px; text-align:center;
            background:#0a0a10; border-bottom:1px solid #1a1a2e;
        }
        .hr-num {
            font-size:72px; font-weight:bold;
            color:#333; line-height:1; transition:color 0.4s;
        }
        .hr-num.valid   { color:#00ff88; }
        .hr-num.warning { color:#ff9900; }
        .hr-num.danger  { color:#ff3333; }
        .hr-bpm { font-size:13px; color:#444; margin-top:3px; }
        .hr-sub { font-size:11px; color:#555; margin-top:4px; min-height:15px; }

        /* Графики */
        .charts { padding:10px 16px; }
        .cb { margin-bottom:12px; }
        .ch {
            font-size:10px; color:#555; text-transform:uppercase;
            letter-spacing:1px; margin-bottom:4px;
            display:flex; justify-content:space-between;
        }
        .ch span { color:#888; }
        canvas.cv {
            width:100%; height:65px; display:block;
            background:#0c0c14; border:1px solid #1a1a2e; border-radius:4px;
        }
        canvas.cv-m { height:85px; }

        /* HRV */
        .hrv {
            display:grid; grid-template-columns:repeat(3,1fr);
            gap:1px; background:#111;
            border-top:1px solid #1a1a2e; border-bottom:1px solid #1a1a2e;
        }
        .hc { background:#0c0c14; padding:9px 8px; text-align:center; }
        .hn { font-size:9px; color:#555; text-transform:uppercase; letter-spacing:1px; }
        .hv { font-size:20px; font-weight:bold; color:#00ff88; margin-top:3px; }
        .hv.w { color:#ff9900; } .hv.b { color:#ff3333; }
        .hu { font-size:9px; color:#444; }

        /* Лог */
        .log-wrap { padding:10px 16px 20px; }
        .lt { font-size:10px; color:#555; text-transform:uppercase; margin-bottom:5px; }
        .lb {
            background:#0c0c14; border:1px solid #1a1a2e;
            border-radius:6px; padding:6px 8px;
            max-height:100px; overflow-y:auto; font-size:11px;
        }
        .lr { padding:2px 0; border-bottom:1px solid #111; display:flex; gap:8px; }
        .lr:last-child { border:none; }
        .lrt { color:#444; min-width:42px; }
        .lrm      { color:#888; }
        .lrm.ok   { color:#00ff88; }
        .lrm.warn { color:#ff9900; }
        .lrm.err  { color:#ff3333; }
        .lrm.info { color:#4488ff; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚡ ПСИХОМЕТР v6</h1>
    <span id="fpsLbl" style="font-size:11px;color:#444">--</span>
</div>

<div class="video-wrap">
    <video id="videoEl" autoplay playsinline muted></video>
    <canvas id="drawCanvas"></canvas>
</div>

<div class="controls">
    <button class="primary" id="btnStart" onclick="startAll()" disabled>▶ Старт</button>
    <button id="btnFlip" onclick="flipCamera()" disabled>⟳ Камера</button>
    <button class="danger" id="btnStop" onclick="stopAll()" disabled>■ Стоп</button>
</div>

<div class="status-banner sb-loading" id="statusBanner">загрузка MediaPipe...</div>
<div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>

<div class="diag">
    <div class="dc"><div class="dn">Лицо</div><div class="dv" id="dFace">--</div></div>
    <div class="dc"><div class="dn">Амплитуда</div><div class="dv" id="dAmp">--</div></div>
    <div class="dc"><div class="dn">Регуляр.</div><div class="dv" id="dReg">--</div></div>
    <div class="dc"><div class="dn">Пиков</div><div class="dv" id="dPeaks">--</div></div>
</div>

<div class="hr-display">
    <div class="hr-num" id="hrNum">--</div>
    <div class="hr-bpm">ударов в минуту</div>
    <div class="hr-sub" id="hrSub">ожидание...</div>
</div>

<div class="charts">
    <div class="cb">
        <div class="ch">CHROM сигнал <span id="lSig">--</span></div>
        <canvas class="cv" id="cvSig"></canvas>
    </div>
    <div class="cb">
        <div class="ch">Фильтр + пики <span id="lFilt">--</span></div>
        <canvas class="cv" id="cvFilt"></canvas>
    </div>
    <div class="cb">
        <div class="ch">Пульс (история) <span id="lHR">--</span></div>
        <canvas class="cv" id="cvHR"></canvas>
    </div>
</div>

<div class="hrv">
    <div class="hc"><div class="hn">RMSSD</div><div class="hv" id="hvR">--</div><div class="hu">мс</div></div>
    <div class="hc"><div class="hn">Стресс</div><div class="hv" id="hvS">--</div><div class="hu">индекс</div></div>
    <div class="hc"><div class="hn">R-R ср.</div><div class="hv" id="hvRR">--</div><div class="hu">мс</div></div>
</div>

<div class="charts">
    <div class="cb">
        <div class="ch">R-R интервалы <span id="lRR">--</span></div>
        <canvas class="cv cv-m" id="cvRR"></canvas>
    </div>
</div>

<div class="log-wrap">
    <div class="lt">Лог</div>
    <div class="lb" id="logBox"></div>
</div>

<script>
// ================================================================
//  ПСИХОМЕТР v6 — MediaPipe FaceMesh + CHROM
//  Используем точную версию CDN из теста: @0.4.1633559619
// ================================================================

// Точки лба (MediaPipe FaceMesh)
const FOREHEAD = [10,151,9,8,107,66,105,104,103,67,109,338,297,332,333,334,296,336,285,8];
const L_CHEEK  = [234,227,116,111,117,118,119,120,121,128,126,142,36,205,187,123];
const R_CHEEK  = [454,447,345,340,346,347,348,349,350,357,355,371,266,425,411,352];

const CFG = {
    BUF_SEC:      12,
    CALIB_SEC:    5,
    BP_LO:        0.7,
    BP_HI:        3.0,
    PEAK_MIN_SEC: 0.33,
    MIN_AMP:      0.003,
    MIN_PEAKS:    4,
    MAX_CV:       0.35,
    VALID_NEED:   2,
    RR_MIN:       350,
    RR_MAX:       1500,
    HR_WIN:       5,
    TRIGGER_CD:   20000,
};

const S = {
    faceMesh:null, mpCamera:null,
    stream:null, facing:'user', running:false,
    sigR:[],sigG:[],sigB:[],times:[],
    chromSig:[],filtered:[],
    peaks:[],rr:[],rrClean:[],
    fps:0,fpsCount:0,fpsTimer:0,
    amplitude:0,rrCV:0,
    hr:0,hrBuf:[],hrHistory:[],
    rmssd:0,stress:0,
    isValid:false,validStreak:0,
    faceOk:false,
    calibDone:false,calibStart:0,
    frameN:0,
    lastTriggers:{},
};

// ================================================================
//  ЗАГРУЗКА MEDIAPIPE — используем версию из теста
// ================================================================
log('info','Загрузка MediaPipe...');

loadScript(
    'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js'
).then(() => {
    log('ok','camera_utils загружен');
    return loadScript(
        'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js'
    );
}).then(() => {
    log('ok','face_mesh загружен, инициализация...');
    return initMP();
}).catch(e => {
    log('err','Ошибка загрузки: '+e.message);
    setBanner('sb-noface','Ошибка загрузки — проверьте интернет');
});

function loadScript(src) {
    return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src; s.crossOrigin = 'anonymous';
        s.onload  = resolve;
        s.onerror = () => reject(new Error('Не загружен: '+src));
        document.head.appendChild(s);
    });
}

async function initMP() {
    try {
        S.faceMesh = new FaceMesh({
            locateFile: f =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`
        });

        S.faceMesh.setOptions({
            maxNumFaces:            1,
            refineLandmarks:        false,
            minDetectionConfidence: 0.4,
            minTrackingConfidence:  0.4,
        });

        S.faceMesh.onResults(onFaceResults);

        log('info','initialize() — ждём загрузку модели...');
        await S.faceMesh.initialize();
        log('ok','MediaPipe готов!');
        setBanner('sb-idle','Готово — нажмите Старт');
        document.getElementById('btnStart').disabled = false;

    } catch(e) {
        log('err','initMP ошибка: '+e.message);
        setBanner('sb-noface','Ошибка инициализации: '+e.message);
    }
}

// ================================================================
//  КАМЕРА
// ================================================================
async function startAll() {
    document.getElementById('btnStart').disabled = true;
    try {
        if (S.stream) S.stream.getTracks().forEach(t=>t.stop());
        if (S.mpCamera) { try{S.mpCamera.stop();}catch(e){} }

        S.stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode: S.facing,
                width:{ideal:640}, height:{ideal:480},
                frameRate:{ideal:30,min:15},
            }
        });

        const v = document.getElementById('videoEl');
        v.srcObject = S.stream;
        await new Promise(r => v.onloadedmetadata = r);
        await v.play();

        document.getElementById('btnFlip').disabled = false;
        document.getElementById('btnStop').disabled = false;

        resetState();
        S.running = true;
        S.calibStart = performance.now();
        setBanner('sb-calib','держите лицо в кадре...');
        log('info','Камера запущена: '+S.facing);

        // Запускаем MediaPipe Camera
        S.mpCamera = new Camera(v, {
            onFrame: async () => {
                if (!S.running || !S.faceMesh) return;
                try {
                    await S.faceMesh.send({image: v});
                } catch(e) {}
            },
            width: 640, height: 480,
        });
        S.mpCamera.start();
        log('ok','MediaPipe Camera запущена');

    } catch(e) {
        log('err','startAll: '+e.message);
        setBanner('sb-noface','Ошибка: '+e.message);
        document.getElementById('btnStart').disabled = false;
    }
}

function flipCamera() {
    S.facing = S.facing==='user'?'environment':'user';
    log('info','Камера: '+S.facing);
    stopAll(false);
    setTimeout(startAll, 400);
}

function stopAll(resetUI=true) {
    S.running = false;
    if (S.mpCamera) { try{S.mpCamera.stop();}catch(e){} S.mpCamera=null; }
    if (S.stream)   { S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; }
    if (resetUI) {
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnFlip').disabled  = true;
        document.getElementById('btnStop').disabled  = true;
        setBanner('sb-idle','остановлено');
        log('info','Остановлено');
    }
}

function resetState() {
    Object.assign(S,{
        sigR:[],sigG:[],sigB:[],times:[],
        chromSig:[],filtered:[],
        peaks:[],rr:[],rrClean:[],
        fps:0,fpsCount:0,fpsTimer:performance.now(),
        amplitude:0,rrCV:0,
        hr:0,hrBuf:[],hrHistory:[],
        rmssd:0,stress:0,
        isValid:false,validStreak:0,faceOk:false,
        calibDone:false,frameN:0,
    });
    document.getElementById('progFill').style.width='0%';
    document.getElementById('progFill').className='prog-fill';
}

// ================================================================
//  CALLBACK MEDIAPIPE
// ================================================================
function onFaceResults(results) {
    if (!S.running) return;

    const ts = performance.now();

    // FPS
    S.fpsCount++;
    if (ts - S.fpsTimer >= 1000) {
        S.fps=S.fpsCount; S.fpsCount=0; S.fpsTimer=ts;
        document.getElementById('fpsLbl').textContent=`FPS:${S.fps}`;
    }

    // Canvas overlay
    const canvas = document.getElementById('drawCanvas');
    const ctx    = canvas.getContext('2d');
    const W = canvas.offsetWidth||360;
    const H = canvas.offsetHeight||220;
    canvas.width=W; canvas.height=H;
    ctx.clearRect(0,0,W,H);

    // Нет лица
    if (!results.multiFaceLandmarks?.length) {
        S.faceOk = false;
        setD('dFace','✗','r');
        if (S.calibDone) setBanner('sb-noface','лицо не найдено');
        drawNoFace(ctx,W,H);
        return;
    }

    S.faceOk = true;
    setD('dFace','✓','g');

    const lm  = results.multiFaceLandmarks[0];
    const video = document.getElementById('videoEl');
    const vw  = video.videoWidth  || 640;
    const vh  = video.videoHeight || 480;

    // Рисуем зоны ROI
    drawZones(ctx, lm, vw, vh, W, H);

    // Захват пикселей
    const hc   = document.createElement('canvas');
    hc.width=vw; hc.height=vh;
    const hctx = hc.getContext('2d',{willReadFrequently:true});
    hctx.drawImage(video, 0, 0, vw, vh);

    const rgbF = roiRGB(hctx, lm, FOREHEAD, vw, vh);
    const rgbL = roiRGB(hctx, lm, L_CHEEK,  vw, vh);
    const rgbR = roiRGB(hctx, lm, R_CHEEK,  vw, vh);

    // Среднее по трём зонам
    const r = (rgbF.r+rgbL.r+rgbR.r)/3;
    const g = (rgbF.g+rgbL.g+rgbR.g)/3;
    const b = (rgbF.b+rgbL.b+rgbR.b)/3;

    S.sigR.push(r); S.sigG.push(g); S.sigB.push(b);
    S.times.push(ts);

    const fps = S.fps||30;
    const maxBuf = Math.round(fps*CFG.BUF_SEC);
    if (S.sigR.length>maxBuf) {
        S.sigR.shift();S.sigG.shift();S.sigB.shift();S.times.shift();
    }

    // Калибровка
    const elapsed = (ts - S.calibStart)/1000;
    const calibP  = Math.min(elapsed/CFG.CALIB_SEC, 1);
    document.getElementById('progFill').style.width=(calibP*100)+'%';
    if (!S.calibDone && calibP>=1) {
        S.calibDone = true;
        document.getElementById('progFill').className='prog-fill ok';
        log('ok','Калибровка завершена, анализирую...');
    }

    if (!S.calibDone) {
        setBanner('sb-calib',`калибровка ${Math.round(calibP*100)}%...`);
    }

    S.frameN++;
    if (S.calibDone && S.frameN%10===0) analyze();

    redrawCharts();
}

// ================================================================
//  ROI из точек лица
// ================================================================
function roiRGB(ctx, lm, ids, vw, vh) {
    let x0=vw,y0=vh,x1=0,y1=0;
    ids.forEach(id=>{
        const p=lm[id]; if(!p) return;
        const px=p.x*vw, py=p.y*vh;
        if(px<x0)x0=px; if(px>x1)x1=px;
        if(py<y0)y0=py; if(py>y1)y1=py;
    });
    const rx=Math.max(0,Math.floor(x0));
    const ry=Math.max(0,Math.floor(y0));
    const rw=Math.max(1,Math.floor(x1-x0));
    const rh=Math.max(1,Math.floor(y1-y0));
    try {
        const id=ctx.getImageData(rx,ry,rw,rh);
        const d=id.data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
        return n?{r:r/n,g:g/n,b:b/n}:{r:128,g:128,b:128};
    } catch(e) { return {r:128,g:128,b:128}; }
}

// ================================================================
//  АЛГОРИТМ CHROM
// ================================================================
function computeCHROM(R,G,B) {
    const n=R.length;
    const X=[],Y=[];
    for(let i=0;i<n;i++){
        const lum=(R[i]+G[i]+B[i])/3||1;
        const rn=R[i]/lum, gn=G[i]/lum, bn=B[i]/lum;
        X.push(3*rn-2*gn);
        Y.push(1.5*rn+gn-1.5*bn);
    }
    const sX=stdDev(X), sY=stdDev(Y);
    const alpha=sY>0?sX/sY:1;
    return X.map((x,i)=>x-alpha*Y[i]);
}

// ================================================================
//  АНАЛИЗ
// ================================================================
function analyze() {
    const N=S.sigR.length;
    if(N<60) return;

    const dt=S.times[N-1]-S.times[0];
    const fps=(N-1)/(dt/1000);
    if(fps<10) return;

    // CHROM
    const chrom=computeCHROM(S.sigR,S.sigG,S.sigB);
    S.chromSig=chrom;

    // Detrend
    const det=detrend(chrom,Math.round(fps*3));

    // Butterworth BP
    const bp=butterBP(det,fps,CFG.BP_LO,CFG.BP_HI);
    S.filtered=bp;

    // Амплитуда
    const amp=stdDev(bp.slice(-Math.round(fps*8)));
    S.amplitude=amp;
    setD('dAmp',amp.toFixed(4), amp>=CFG.MIN_AMP?'g':amp>=CFG.MIN_AMP*0.5?'y':'r');

    if(amp<CFG.MIN_AMP) {
        setInvalid(`слабый сигнал A:${amp.toFixed(4)}`);
        return;
    }

    // Пики
    const peaks=findPeaks(bp, Math.round(fps*CFG.PEAK_MIN_SEC));
    S.peaks=peaks;
    setD('dPeaks',peaks.length, peaks.length>=CFG.MIN_PEAKS?'g':peaks.length>=2?'y':'r');

    if(peaks.length<CFG.MIN_PEAKS) {
        setInvalid(`мало пиков: ${peaks.length}`);
        return;
    }

    // R-R
    const rr=[];
    for(let i=1;i<peaks.length;i++){
        const ms=((peaks[i]-peaks[i-1])/fps)*1000;
        if(ms>=CFG.RR_MIN&&ms<=CFG.RR_MAX) rr.push(ms);
    }
    if(rr.length<2) { setInvalid('R-R вне диапазона'); return; }

    // CV
    const rrMean=rr.reduce((a,b)=>a+b,0)/rr.length;
    const cv=stdDev(rr)/rrMean;
    S.rrCV=cv;
    const reg=Math.round((1-cv)*100);
    setD('dReg',reg+'%', cv<=CFG.MAX_CV?'g':cv<=CFG.MAX_CV*1.5?'y':'r');

    if(cv>CFG.MAX_CV) {
        setInvalid(`нерегулярно CV:${cv.toFixed(2)}`);
        return;
    }

    // УСПЕХ
    S.rrClean=rr;
    S.validStreak++;

    if(S.validStreak>=CFG.VALID_NEED) {
        S.isValid=true;
        S.hrBuf.push(60000/rrMean);
        if(S.hrBuf.length>CFG.HR_WIN) S.hrBuf.shift();
        S.hr=Math.round(S.hrBuf.reduce((a,b)=>a+b,0)/S.hrBuf.length);
        S.rmssd=Math.round(calcRMSSD(rr));
        S.stress=calcStress(S.hr,S.rmssd);
        S.hrHistory.push(S.hr);
        if(S.hrHistory.length>120) S.hrHistory.shift();

        updateHR();
        updateHRV();
        checkTriggers();
        setBanner('sb-valid',`❤ ${S.hr} уд/мин  |  регуляр: ${reg}%`);
    } else {
        setBanner('sb-confirm',`подтверждение ${S.validStreak}/${CFG.VALID_NEED}...`);
    }
}

function setInvalid(reason) {
    const was=S.isValid;
    S.isValid=false; S.validStreak=0;
    if(S.hrBuf.length>0) S.hrBuf.shift();
    if(was) document.getElementById('hrNum').className='hr-num';
    setBanner('sb-weak',reason);
    document.getElementById('hrSub').textContent=reason;
}

// ================================================================
//  DSP
// ================================================================
function detrend(sig,win) {
    const half=Math.floor(win/2);
    return sig.map((v,i)=>{
        const lo=Math.max(0,i-half),hi=Math.min(sig.length-1,i+half);
        let s=0;for(let j=lo;j<=hi;j++)s+=sig[j];
        return v-s/(hi-lo+1);
    });
}

function butterBP(sig,fs,f1,f2){
    return butter2LP(butter2HP(sig,fs,f1),fs,f2);
}
function butter2HP(sig,fs,fc){
    const w=2*Math.PI*fc/fs,k=Math.tan(w/2),k2=k*k,q=Math.SQRT2,a0=1+q*k+k2;
    return biquad(sig,[1/a0,-2/a0,1/a0],[1,2*(k2-1)/a0,(1-q*k+k2)/a0]);
}
function butter2LP(sig,fs,fc){
    const w=2*Math.PI*fc/fs,k=Math.tan(w/2),k2=k*k,q=Math.SQRT2,a0=1+q*k+k2;
    return biquad(sig,[k2/a0,2*k2/a0,k2/a0],[1,2*(k2-1)/a0,(1-q*k+k2)/a0]);
}
function biquad(sig,b,a){
    const out=new Array(sig.length).fill(0);
    let x1=0,x2=0,y1=0,y2=0;
    for(let i=0;i<sig.length;i++){
        const x0=sig[i],y0=b[0]*x0+b[1]*x1+b[2]*x2-a[1]*y1-a[2]*y2;
        out[i]=y0;x2=x1;x1=x0;y2=y1;y1=y0;
    }
    return out;
}

function findPeaks(sig,minDist){
    const N=sig.length;
    const pos=sig.filter(v=>v>0);
    if(!pos.length) return [];
    const thr=median(pos)*0.4;
    const peaks=[];let last=-minDist;
    for(let i=1;i<N-1;i++){
        if(sig[i]>thr&&sig[i]>=sig[i-1]&&sig[i]>=sig[i+1]&&i-last>=minDist){
            let best=i;
            for(let j=Math.max(1,i-3);j<=Math.min(N-2,i+3);j++)
                if(sig[j]>sig[best]) best=j;
            if(best-last>=minDist){peaks.push(best);last=best;}
        }
    }
    return peaks;
}

function calcRMSSD(rr){
    if(rr.length<2)return 0;
    let s=0;for(let i=1;i<rr.length;i++){const d=rr[i]-rr[i-1];s+=d*d;}
    return Math.sqrt(s/(rr.length-1));
}
function calcStress(hr,rv){
    return Math.round(
        Math.max(0,Math.min(100,(hr-60)*2))*0.4+
        Math.max(0,Math.min(100,100-rv*2))*0.6);
}
function stdDev(a){
    if(a.length<2)return 0;
    const mn=a.reduce((s,v)=>s+v,0)/a.length;
    return Math.sqrt(a.map(v=>(v-mn)**2).reduce((s,v)=>s+v,0)/a.length);
}
function median(a){
    const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);
    return s.length%2?s[m]:(s[m-1]+s[m])/2;
}

// ================================================================
//  OVERLAY
// ================================================================
function drawNoFace(ctx,W,H){
    ctx.fillStyle='rgba(255,80,0,0.08)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff6600';
    ctx.font='bold 13px Courier New';
    ctx.textAlign='center';
    ctx.fillText('Лицо не найдено',W/2,H/2-8);
    ctx.font='11px Courier New';
    ctx.fillStyle='#ff4400';
    ctx.fillText('смотрите прямо в камеру',W/2,H/2+10);
    ctx.textAlign='left';
}

function drawZones(ctx, lm, vw, vh, W, H) {
    const sx=W/vw, sy=H/vh;

    const drawZ=(ids,color,label)=>{
        let x0=vw,y0=vh,x1=0,y1=0;
        ids.forEach(id=>{
            const p=lm[id];if(!p)return;
            const px=p.x*vw,py=p.y*vh;
            if(px<x0)x0=px;if(px>x1)x1=px;
            if(py<y0)y0=py;if(py>y1)y1=py;
        });
        const rx=x0*sx,ry=y0*sy,rw=(x1-x0)*sx,rh=(y1-y0)*sy;
        if(rw<2||rh<2)return;

        ctx.strokeStyle=color;ctx.lineWidth=2;
        ctx.shadowColor=color;ctx.shadowBlur=8;
        ctx.strokeRect(rx,ry,rw,rh);ctx.shadowBlur=0;

        ctx.globalAlpha=0.12;
        ctx.fillStyle=color;
        ctx.fillRect(rx,ry,rw,rh);
        ctx.globalAlpha=1;

        ctx.fillStyle=color;
        ctx.font='bold 10px Courier New';
        ctx.fillText(label,rx+2,ry-3);
    };

    const col=S.isValid?'#00ff88':'#ff9900';
    drawZ(FOREHEAD,col,'ЛОБ');
    drawZ(L_CHEEK, '#4488ff','Щ.Л');
    drawZ(R_CHEEK, '#4488ff','Щ.П');

    // Точки лица (мелкие)
    ctx.fillStyle='rgba(255,255,255,0.25)';
    lm.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x*W,p.y*H,1,0,Math.PI*2);
        ctx.fill();
    });
}

// ================================================================
//  ГРАФИКИ
// ================================================================
function redrawCharts(){
    plotSig();
    plotFilt();
    plotHR();
    if(S.rrClean.length>=3) plotRR();
}

function plotSig(){
    const d=S.chromSig.slice(-300);
    if(d.length<2)return;
    line('cvSig',d,'#4488ff','lSig',
        d=>`${d[d.length-1].toFixed(4)}`);
}

function plotFilt(){
    const d=S.filtered.slice(-300);
    if(d.length<2)return;
    const cv=document.getElementById('cvFilt');
    const ctx=cv.getContext('2d');
    const W=cv.offsetWidth||300,H=cv.offsetHeight||65;
    cv.width=W;cv.height=H;
    ctx.fillStyle='#0c0c14';ctx.fillRect(0,0,W,H);
    grid(ctx,W,H);

    const mn=Math.min(...d),mx=Math.max(...d),rng=mx-mn||1;
    const sy=v=>H-((v-mn)/rng)*H*0.85-H*0.075;

    ctx.strokeStyle='#00ff88';ctx.lineWidth=1.5;
    ctx.shadowColor='#00ff88';ctx.shadowBlur=3;
    ctx.beginPath();
    d.forEach((v,i)=>{
        const x=(i/(d.length-1))*W;
        i===0?ctx.moveTo(x,sy(v)):ctx.lineTo(x,sy(v));
    });
    ctx.stroke();ctx.shadowBlur=0;

    if(S.peaks.length&&S.filtered.length){
        const off=S.filtered.length-d.length;
        ctx.fillStyle='#ff3300';
        S.peaks.forEach(pi=>{
            const di=pi-off;
            if(di>=0&&di<d.length){
                const x=(di/(d.length-1))*W;
                ctx.beginPath();ctx.arc(x,sy(d[di]),4,0,Math.PI*2);ctx.fill();
            }
        });
    }
    document.getElementById('lFilt').textContent=`A:${S.amplitude.toFixed(4)}`;
}

function plotHR(){
    const d=S.hrHistory;if(d.length<2)return;
    const cv=document.getElementById('cvHR');
    const ctx=cv.getContext('2d');
    const W=cv.offsetWidth||300,H=cv.offsetHeight||65;
    cv.width=W;cv.height=H;
    ctx.fillStyle='#0c0c14';ctx.fillRect(0,0,W,H);
    const mn=Math.max(40,Math.min(...d)-5),mx=Math.min(180,Math.max(...d)+5),rng=mx-mn||1;
    [[40,60,'rgba(0,80,255,0.08)'],[60,100,'rgba(0,255,136,0.08)'],
     [100,140,'rgba(255,140,0,0.08)'],[140,180,'rgba(255,40,40,0.08)']
    ].forEach(([a,b,c])=>{
        const y1=H-((Math.min(b,mx)-mn)/rng)*H,y2=H-((Math.max(a,mn)-mn)/rng)*H;
        if(y1<y2){ctx.fillStyle=c;ctx.fillRect(0,y1,W,y2-y1);}
    });
    ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(0,255,136,0.2)';ctx.lineWidth=1;
    [60,100].forEach(v=>{
        if(v>=mn&&v<=mx){const y=H-((v-mn)/rng)*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    });
    ctx.setLineDash([]);
    ctx.strokeStyle='#ff6600';ctx.lineWidth=2;ctx.shadowColor='#ff6600';ctx.shadowBlur=5;
    ctx.beginPath();
    d.forEach((v,i)=>{const x=(i/(d.length-1))*W,y=H-((v-mn)/rng)*H;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.stroke();ctx.shadowBlur=0;
    document.getElementById('lHR').textContent=`${S.hr} уд/мин`;
}

function plotRR(){
    const rr=S.rrClean;if(rr.length<3)return;
    const cv=document.getElementById('cvRR');
    const ctx=cv.getContext('2d');
    const W=cv.offsetWidth||300,H=cv.offsetHeight||85;
    cv.width=W;cv.height=H;
    ctx.fillStyle='#0c0c14';ctx.fillRect(0,0,W,H);
    const mn=Math.min(...rr)-30,mx=Math.max(...rr)+30,rng=mx-mn||1;
    const avg=rr.reduce((a,b)=>a+b,0)/rr.length;
    const avgY=H-((avg-mn)/rng)*H;
    ctx.strokeStyle='rgba(0,255,136,0.25)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(0,avgY);ctx.lineTo(W,avgY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,255,136,0.4)';ctx.font='10px Courier New';
    ctx.fillText(`avg:${Math.round(avg)}мс`,4,avgY-4);
    const bw=Math.max(3,W/rr.length-2);
    rr.forEach((v,i)=>{
        const x=(i/rr.length)*W,y=H-((v-mn)/rng)*H,dev=Math.abs(v-avg);
        ctx.fillStyle=dev<30?'#00ff88':dev<80?'#ff9900':'#ff3333';
        ctx.fillRect(x,y,bw,H-y);
        if(i>0){
            const px=((i-1)/rr.length)*W+bw/2,py=H-((rr[i-1]-mn)/rng)*H;
            ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x+bw/2,y);ctx.stroke();
        }
    });
    document.getElementById('lRR').textContent=`RMSSD:${S.rmssd}мс | CV:${S.rrCV.toFixed(3)}`;
}

function line(id,data,color,lblId,fmtFn){
    const cv=document.getElementById(id);
    const ctx=cv.getContext('2d');
    const W=cv.offsetWidth||300,H=cv.offsetHeight||65;
    cv.width=W;cv.height=H;
    ctx.fillStyle='#0c0c14';ctx.fillRect(0,0,W,H);
    grid(ctx,W,H);
    const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||0.001;
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.shadowColor=color;ctx.shadowBlur=3;
    ctx.beginPath();
    data.forEach((v,i)=>{
        const x=(i/(data.length-1))*W,y=H-((v-mn)/rng)*H*0.85-H*0.075;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();ctx.shadowBlur=0;
    if(lblId&&fmtFn)document.getElementById(lblId).textContent=fmtFn(data);
}

function grid(ctx,W,H){
    ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
    for(let i=1;i<4;i++){const y=H/4*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

// ================================================================
//  UI
// ================================================================
function setBanner(cls,text){
    const el=document.getElementById('statusBanner');
    el.className='status-banner '+cls;
    el.textContent=text;
}
function setD(id,val,cls){
    const el=document.getElementById(id);
    el.textContent=val;
    if(cls)el.className='dv '+cls;
}
function updateHR(){
    const el=document.getElementById('hrNum');
    el.textContent=S.hr;
    el.className='hr-num '+(S.hr>100||(S.hr<50&&S.hr>0)?'danger':S.hr>90?'warning':'valid');
    document.getElementById('hrSub').textContent=
        `регулярность ${Math.round((1-S.rrCV)*100)}% | R-R avg: ${
         S.rrClean.length?Math.round(S.rrClean.reduce((a,b)=>a+b,0)/S.rrClean.length):0}мс`;
}
function updateHRV(){
    const sv=(id,v,wFn,bFn)=>{
        const el=document.getElementById(id);
        el.textContent=v>0?v:'--';
        el.className='hv'+(bFn&&bFn(v)?' b':wFn&&wFn(v)?' w':'');
    };
    sv('hvR',S.rmssd,v=>v<25&&v>0,v=>v<15&&v>0);
    sv('hvS',S.stress,v=>v>50,v=>v>75);
    const rra=S.rrClean.length?Math.round(S.rrClean.reduce((a,b)=>a+b,0)/S.rrClean.length):0;
    sv('hvRR',rra);
}
function checkTriggers(){
    if(!S.isValid)return;
    const now=Date.now();
    const t=(key,type,msg)=>{
        if(!S.lastTriggers[key]||now-S.lastTriggers[key]>CFG.TRIGGER_CD){
            S.lastTriggers[key]=now;log(type,msg);
        }
    };
    if(S.hr>100)      t('tach','err',`Тахикардия: ${S.hr} уд/мин`);
    else if(S.hr<50)  t('brad','err',`Брадикардия: ${S.hr} уд/мин`);
    else              t('ok','ok',`Пульс: ${S.hr} уд/мин`);
    if(S.rmssd>0&&S.rmssd<15) t('hl','err','HRV критически низкий');
    if(S.stress>75)   t('sh','err',`Высокий стресс: ${S.stress}%`);
}

let logN=0;
function log(type,msg){
    logN++;
    const box=document.getElementById('logBox');
    const time=new Date().toTimeString().slice(0,8);
    const row=document.createElement('div');
    row.className='lr';
    row.innerHTML=`<span class="lrt">${time}</span>
        <span class="lrm ${type}">${msg}</span>`;
    box.insertBefore(row,box.firstChild);
    if(logN>50)box.removeChild(box.lastChild);
}

window.addEventListener('resize',redrawCharts);
</script>
