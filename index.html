<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MP Test</title>
    <style>
        body { background:#111; color:#eee; font-family:monospace; padding:16px; }
        .row { padding:6px 0; border-bottom:1px solid #222; font-size:12px; }
        .ok  { color:#00ff88; }
        .err { color:#ff3333; }
        .wait{ color:#ff9900; }
        .info{ color:#4488ff; }
        button {
            margin:8px 4px; padding:10px 16px;
            background:#1a1a2e; border:1px solid #444;
            color:#eee; font-family:monospace;
            border-radius:6px; cursor:pointer; font-size:13px;
        }
        #log { margin-top:12px; max-height:400px; overflow-y:auto; }
    </style>
</head>
<body>
<h3 style="color:#00ff88;margin-bottom:12px;">MediaPipe Тест</h3>

<button onclick="test1()">1. Тест загрузки скрипта</button>
<button onclick="test2()">2. Тест FaceMesh объекта</button>
<button onclick="test3()">3. Тест без initialize()</button>

<div id="log"></div>

<script>
function L(text, cls='info') {
    const d = document.createElement('div');
    d.className = 'row ' + cls;
    d.textContent = new Date().toTimeString().slice(0,8) + ' ' + text;
    document.getElementById('log').prepend(d);
}

// Тест 1: просто загружаем скрипт
async function test1() {
    L('=== ТЕСТ 1: загрузка скрипта ===');
    
    const urls = [
        'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js',
        'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js',
        'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js',
    ];
    
    for (const url of urls) {
        L('Пробую: ' + url.split('/').slice(-2).join('/'), 'wait');
        try {
            await loadScript(url);
            L('✓ Загружен: ' + url.split('/').slice(-2).join('/'), 'ok');
            L('typeof FaceMesh = ' + typeof FaceMesh, 
              typeof FaceMesh !== 'undefined' ? 'ok' : 'err');
            break;
        } catch(e) {
            L('✗ Ошибка: ' + e.message, 'err');
        }
    }
}

// Тест 2: создаём объект БЕЗ initialize
async function test2() {
    L('=== ТЕСТ 2: создание объекта ===');
    
    if (typeof FaceMesh === 'undefined') {
        L('FaceMesh не загружен — сначала тест 1', 'err');
        return;
    }
    
    try {
        L('Создаём FaceMesh...', 'wait');
        const fm = new FaceMesh({
            locateFile: (f) => {
                L('locateFile запрос: ' + f, 'info');
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${f}`;
            }
        });
        L('✓ Объект создан', 'ok');
        
        fm.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.3,
            minTrackingConfidence: 0.3,
        });
        L('✓ Опции установлены', 'ok');
        
        fm.onResults((r) => {
            L('onResults вызван! Лиц: ' + 
              (r.multiFaceLandmarks?.length || 0), 'ok');
        });
        L('✓ Callback установлен', 'ok');
        
        window._fm = fm;
        L('Объект сохранён в window._fm', 'info');
        L('→ Теперь нажмите тест 3', 'wait');
        
    } catch(e) {
        L('✗ Ошибка: ' + e.message, 'err');
        L('Stack: ' + e.stack, 'err');
    }
}

// Тест 3: пробуем initialize с таймаутом
async function test3() {
    L('=== ТЕСТ 3: initialize() с таймаутом 15 сек ===');
    
    if (!window._fm) {
        L('Сначала запустите тест 2', 'err');
        return;
    }
    
    L('Запускаем initialize() — ждём до 15 сек...', 'wait');
    
    try {
        const result = await Promise.race([
            window._fm.initialize(),
            new Promise((_, reject) => 
                setTimeout(() => reject(new Error('Таймаут 15 сек')), 15000)
            )
        ]);
        L('✓ initialize() завершён!', 'ok');
        L('Теперь можно использовать FaceMesh', 'ok');
        
    } catch(e) {
        L('✗ ' + e.message, 'err');
        if (e.message.includes('Таймаут')) {
            L('initialize() завис — проблема с CDN или WASM', 'err');
            L('Попробуем альтернативный CDN...', 'wait');
            await tryAlternative();
        }
    }
}

async function tryAlternative() {
    L('Пробуем unpkg.com...', 'wait');
    try {
        // Удаляем старый скрипт
        document.querySelectorAll('script[data-mp]').forEach(s=>s.remove());
        
        await loadScript(
            'https://unpkg.com/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js',
            'data-mp'
        );
        L('✓ Скрипт с unpkg загружен', 'ok');
        L('typeof FaceMesh = ' + typeof FaceMesh,
          typeof FaceMesh !== 'undefined' ? 'ok' : 'err');
    } catch(e) {
        L('✗ unpkg тоже не работает: ' + e.message, 'err');
        L('→ Проблема в сети или блокировке CDN', 'err');
        checkNetwork();
    }
}

async function checkNetwork() {
    L('=== Проверка сети ===', 'wait');
    
    const urls = [
        'https://cdn.jsdelivr.net/npm/jquery@3/dist/jquery.min.js',
        'https://unpkg.com/react@18/umd/react.production.min.js',
    ];
    
    for (const url of urls) {
        try {
            const r = await fetch(url, {method:'HEAD', mode:'no-cors'});
            L('✓ CDN доступен: ' + new URL(url).hostname, 'ok');
        } catch(e) {
            L('✗ CDN недоступен: ' + new URL(url).hostname, 'err');
        }
    }
    
    // Проверяем конкретный файл MP
    L('Проверяем файл WASM...', 'wait');
    try {
        const r = await fetch(
            'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh_solution_simd_wasm_bin.wasm',
            { method: 'HEAD' }
        );
        L(`WASM файл: ${r.status} ${r.statusText}`, r.ok?'ok':'err');
        L(`Content-Length: ${r.headers.get('content-length')} байт`, 'info');
    } catch(e) {
        L('✗ WASM недоступен: ' + e.message, 'err');
    }
}

function loadScript(src, attr) {
    return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src;
        if (attr) s.setAttribute(attr, '');
        s.onload  = resolve;
        s.onerror = () => reject(new Error('Не удалось загрузить: ' + src));
        document.head.appendChild(s);
        // Таймаут на загрузку скрипта
        setTimeout(() => reject(new Error('Таймаут загрузки скрипта')), 10000);
    });
}

L('Страница загружена. Нажмите кнопки по порядку: 1 → 2 → 3', 'ok');
</script>
</body>
</html>
