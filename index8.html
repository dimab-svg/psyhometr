<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>rPPG v8.1 — Честный (исправленный)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a12;color:#d1d5db;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px;overflow-x:hidden}
h1{font-size:1.15rem;color:#38bdf8}
.sub{font-size:.68rem;color:#6b7280;margin-bottom:6px;text-align:center}
.row{display:flex;gap:10px;max-width:900px;width:100%;flex-wrap:wrap;justify-content:center}
.cam{position:relative;width:340px;height:255px;background:#000;border-radius:8px;overflow:hidden;border:2px solid #1e293b}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.cards{display:flex;flex-direction:column;gap:5px;width:220px}
.cd{background:#111827;border:1px solid #1e293b;padding:6px 10px;border-radius:7px;text-align:center}
.cd .t{font-size:.58rem;color:#9ca3af;text-transform:uppercase}
.cd .v{font-size:1.7rem;font-weight:800;color:#38bdf8;margin:1px 0}
.cd .u{font-size:.58rem;color:#6b7280}
.cd.st .v{color:#f87171}
.cd.hr .v{color:#4ade80}
.hb{text-align:center;padding:4px}
.heart{font-size:2.2rem;display:inline-block;opacity:.15;transform:scale(1);transition:transform .06s,opacity .06s}
.heart.beat{opacity:1;transform:scale(1.3);filter:drop-shadow(0 0 12px #ef4444)}
.bi{font-size:.62rem;color:#9ca3af;min-height:1.8em}
.sb{width:100%;max-width:580px;background:#111827;border:1px solid #1e293b;padding:5px 10px;border-radius:5px;margin-top:5px;font-size:.7rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:4px}
.dot.ok{background:#22c55e;box-shadow:0 0 5px #22c55e}
.dot.w{background:#f59e0b;box-shadow:0 0 5px #f59e0b}
.ch{width:100%;max-width:580px;margin-top:5px;display:flex;flex-direction:column;gap:4px}
canvas.gc{width:100%;height:100px;background:#111827;border:1px solid #1e293b;border-radius:5px}
.ctr{margin-top:6px;display:flex;gap:8px}
button{background:#0284c7;color:#fff;border:none;padding:8px 16px;border-radius:5px;font-weight:600;cursor:pointer;font-size:.8rem}
button.off{background:#dc2626}
.warn{color:#f59e0b;font-size:.62rem;text-align:center;margin-top:4px;max-width:580px;line-height:1.3}
.dbg{width:100%;max-width:580px;margin-top:4px;font-size:.6rem;color:#444;font-family:monospace;background:#0a0a15;padding:4px 8px;border-radius:4px;max-height:60px;overflow-y:auto}
</style>
</head>
<body>
<h1>🫀 rPPG v8.1 — Честный пульс</h1>
<div class="sub">Без интерполяции · Только реальные пики · Dual-ROI</div>

<div class="row">
 <div class="cam">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="ov" width="340" height="255"></canvas>
 </div>
 <div class="cards">
  <div class="cd"><div class="t">❤️ Пульс</div><div class="v" id="vB">--</div><div class="u">BPM</div></div>
  <div class="cd hb"><span class="heart" id="hrt">❤️</span><div class="bi" id="bi">Ожидание...</div></div>
  <div class="cd hr"><div class="t">HRV</div><div class="v" id="vH">--</div><div class="u">RMSSD мс</div></div>
  <div class="cd st"><div class="t">Стресс</div><div class="v" id="vS">--</div><div class="u">0–100</div></div>
 </div>
</div>

<div class="sb">
 <div><span class="dot" id="dot"></span><span id="stT">Нажмите Старт</span></div>
 <div><span id="fpL" style="color:#555"></span> <span id="ampL" style="color:#555"></span></div>
</div>

<div class="ch">
 <canvas id="cP" class="gc"></canvas>
 <canvas id="cR" class="gc"></canvas>
</div>

<div class="ctr">
 <button id="bOn">▶ Старт</button>
 <button id="bOff" class="off" style="display:none">⏹ Стоп</button>
</div>
<div class="warn">⚠ Без интерполяции. Если пульс не определяется — значит сигнала недостаточно. Держите телефон неподвижно, свет на лицо, лоб открыт.</div>
<div class="dbg" id="dbg"></div>

<script>
const W=340, H=255;
const FACE={x:.22,y:.10,w:.56,h:.50};
const BG_ROIS=[
 {x:.01,y:.01,w:.12,h:.12},
 {x:.87,y:.01,w:.12,h:.12},
 {x:.01,y:.87,w:.12,h:.12},
 {x:.87,y:.87,w:.12,h:.12}
];

const BPM_LO=44, BPM_HI=185;
const IBI_MIN=324, IBI_MAX=1364;
const WARMUP_FRAMES=90;      // ~3 сек прогрева фильтра
const CALIB_FRAMES=60;       // ~2 сек калибровки статистики после прогрева
const MIN_AMP=0.0003;        // Очень низкий порог — для слабых камер
const Z_THRESH=1.4;
const REFR_MS=380;

let on=false, stm=null, raf=null;
let greenNorm=[], rawT=[];
let filtSig=[];
let sBPM=NaN, sHRV=NaN, lastVBPM=NaN, lastVT=0;
let pSkinG=NaN;
let realIBIs=[], beatTs=[];
let hrtTmr=null;

// IIR
let iirHP, iirLP, cHP, cLP;
let frameNum=0;

// Z-score
let zMean=0, zVar=0;
let lastPkT=0;
let sigAmp=0;
let totalBeats=0, rejectedBeats=0;

// FPS
let fpsFrames=0, fpsT0=0, fps=25;

// DOM
const vid=document.getElementById('vid');
const ov=document.getElementById('ov');
const co=ov.getContext('2d');
const bOn=document.getElementById('bOn'), bOff=document.getElementById('bOff');
const stT=document.getElementById('stT'), dot=document.getElementById('dot');
const fpL=document.getElementById('fpL'), ampL=document.getElementById('ampL');
const vB=document.getElementById('vB'), vH=document.getElementById('vH'), vS=document.getElementById('vS');
const hrt=document.getElementById('hrt'), bi=document.getElementById('bi');
const cP=document.getElementById('cP'), xP=cP.getContext('2d');
const cR=document.getElementById('cR'), xR=cR.getContext('2d');
const dbg=document.getElementById('dbg');
const hc=document.createElement('canvas');
hc.width=W; hc.height=H;
const hx=hc.getContext('2d',{willReadFrequently:true});

function log(s){
 const t=new Date();
 const ts=t.getMinutes()+':'+String(t.getSeconds()).padStart(2,'0');
 dbg.textContent=`[${ts}] ${s}\n`+dbg.textContent;
 if(dbg.textContent.length>2000) dbg.textContent=dbg.textContent.slice(0,2000);
}

bOn.onclick=startApp;
bOff.onclick=stopApp;

async function startApp(){
 try{
  log('Запрос камеры...');
  stm=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false
  });
  vid.srcObject=stm;
  await vid.play();
  log('Камера запущена');
  resetAll();
  on=true;
  bOn.style.display='none';bOff.style.display='';
  loop();
 }catch(e){
  log('ОШИБКА: '+e.message);
  alert('Камера: '+e.message);
 }
}

function stopApp(){
 on=false;
 // НЕ делаем cancelAnimationFrame — просто ставим флаг, цикл сам остановится
 setTimeout(()=>{
  if(stm){stm.getTracks().forEach(t=>t.stop());stm=null}
  vid.srcObject=null;
  bOn.style.display='';bOff.style.display='none';
  stT.textContent='Остановлено';dot.className='dot';
  log('Остановлено');
 },100);
}

function resetAll(){
 greenNorm=[];rawT=[];filtSig=[];
 sBPM=NaN;sHRV=NaN;lastVBPM=NaN;lastVT=0;
 pSkinG=NaN;realIBIs=[];beatTs=[];
 zMean=0;zVar=0;lastPkT=0;sigAmp=0;
 totalBeats=0;rejectedBeats=0;
 frameNum=0;fpsFrames=0;fpsT0=performance.now();fps=25;
 vB.textContent='--';vH.textContent='--';vS.textContent='--';
 bi.textContent='Ожидание...';

 // Инициализируем IIR СРАЗУ с предполагаемым FPS=25
 initIIR(25);
 log('Буферы сброшены, IIR инициализирован (25fps)');
}

// =========================================================================
//  IIR BUTTERWORTH 2nd ORDER — инициализация ОДИН раз
// =========================================================================
function initIIR(fs){
 function makeCoeffs(fc,fs,type){
  const w0=Math.tan(Math.PI*fc/fs),w2=w0*w0,sq=Math.SQRT2,k=1+sq*w0+w2;
  if(type==='hp') return{b0:1/k,b1:-2/k,b2:1/k,a1:2*(w2-1)/k,a2:(1-sq*w0+w2)/k};
  return{b0:w2/k,b1:2*w2/k,b2:w2/k,a1:2*(w2-1)/k,a2:(1-sq*w0+w2)/k};
 }
 cHP=makeCoeffs(0.7,fs,'hp');
 cLP=makeCoeffs(3.0,fs,'lp');
 iirHP={x1:0,x2:0,y1:0,y2:0};
 iirLP={x1:0,x2:0,y1:0,y2:0};
}

function iirFilt(x,st,c){
 const y=c.b0*x+c.b1*st.x1+c.b2*st.x2-c.a1*st.y1-c.a2*st.y2;
 st.x2=st.x1;st.x1=x;st.y2=st.y1;st.y1=y;return y;
}

// =========================================================================
//  ГЛАВНЫЙ ЦИКЛ
// =========================================================================
function loop(){
 if(!on){return} // Просто выходим, не ставим новый RAF

 try{
  const now=performance.now();
  frameNum++;
  fpsFrames++;

  // FPS каждые 3 секунды
  if(now-fpsT0>3000 && fpsFrames>10){
   fps=fpsFrames/((now-fpsT0)/1000);
   fpL.textContent=fps.toFixed(0)+'fps';
   fpsFrames=0;fpsT0=now;

   // Если реальный FPS сильно отличается от 25 и это первый пересчёт — обновить IIR
   if(frameNum<200 && Math.abs(fps-25)>5){
    initIIR(fps);
    log('IIR пересчитан для '+fps.toFixed(0)+'fps');
   }
  }

  hx.drawImage(vid,0,0,W,H);
  const px=hx.getImageData(0,0,W,H).data;

  // ===== ФОН (4 угла) =====
  let bgG=0,bgN=0;
  for(const roi of BG_ROIS){
   const rx=Math.floor(W*roi.x),ry=Math.floor(H*roi.y);
   const rw=Math.floor(W*roi.w),rh=Math.floor(H*roi.h);
   let s=0,c=0;
   for(let y=ry;y<ry+rh;y+=2){
    for(let x=rx;x<rx+rw;x+=2){
     s+=px[(y*W+x)*4+1]; c++;
    }
   }
   if(c>0){bgG+=s/c;bgN++}
  }
  bgG=bgN>0?bgG/bgN:128;

  // ===== КОЖА ЛИЦА =====
  const fx=Math.floor(W*FACE.x),fy=Math.floor(H*FACE.y);
  const fw=Math.floor(W*FACE.w),fh=Math.floor(H*FACE.h);
  let skinG=0,skinR=0,skinB=0,skinC=0,totalC=0;
  for(let y=fy;y<fy+fh;y+=2){
   for(let x=fx;x<fx+fw;x+=2){
    totalC++;
    const i=(y*W+x)*4;
    const r=px[i],g=px[i+1],b=px[i+2];
    // Фильтр кожи
    if(r>50&&g>30&&b>15&&r>b+3&&(r-b)>8&&r<252){
     const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
     if(mx-mn>6){
      let hue=0;const d=mx-mn;
      if(mx===r)hue=60*((g-b)/d%6);
      else if(mx===g)hue=60*((b-r)/d+2);
      else hue=60*((r-g)/d+4);
      if(hue<0)hue+=360;
      if(hue<=55||hue>=335){
       skinG+=g;skinR+=r;skinB+=b;skinC++;
      }
     }
    }
   }
  }

  const skinRatio=skinC/Math.max(totalC,1);
  const skinOk=skinRatio>.20;
  const avgG=skinC>0?skinG/skinC:0;

  // ===== РИСУЕМ ROI ВСЕГДА =====
  drawROI(fx,fy,fw,fh,skinOk,skinRatio);

  if(!skinOk){
   stT.textContent='⚠ Направьте лицо в зелёную рамку';
   dot.className='dot';
   if(frameNum%60===0) log('Кожа не найдена ('+Math.round(skinRatio*100)+'%)');
  }
  else{
   // Motion check
   if(!isNaN(pSkinG)){
    const d=Math.abs(avgG-pSkinG);
    if(d>4.5){
     pSkinG=avgG;
     stT.textContent='🔄 Движение — замрите!';
     dot.className='dot w';
     // Не выходим! Продолжаем, просто пропускаем этот кадр для детекции
     raf=requestAnimationFrame(loop);
     return;
    }
   }
   pSkinG=avgG;

   // Dual-ROI нормализация
   const gn=bgG>10?avgG/bgG:avgG/128;
   greenNorm.push(gn);
   rawT.push(now);
   const maxBuf=Math.floor(fps*12);
   while(greenNorm.length>maxBuf){greenNorm.shift();rawT.shift()}

   // IIR полосовой
   const hp=iirFilt(gn,iirHP,cHP);
   const bp=iirFilt(hp,iirLP,cLP);
   filtSig.push(bp);
   if(filtSig.length>maxBuf) filtSig.shift();

   // Фазы работы
   if(frameNum<WARMUP_FRAMES){
    // Прогрев IIR (переходный процесс)
    const pct=Math.round(frameNum/WARMUP_FRAMES*100);
    stT.textContent=`Прогрев фильтра: ${pct}%`;
    dot.className='dot w';
   }
   else if(frameNum<WARMUP_FRAMES+CALIB_FRAMES){
    // Калибровка статистики
    const a=0.05;
    zMean=zMean*(1-a)+bp*a;
    zVar=zVar*(1-a)+(bp-zMean)**2*a;
    const pct=Math.round((frameNum-WARMUP_FRAMES)/CALIB_FRAMES*100);
    stT.textContent=`Калибровка: ${pct}% (замрите!)`;
    dot.className='dot w';
    if(frameNum===WARMUP_FRAMES+CALIB_FRAMES-1){
     log('Калибровка OK. zMean='+zMean.toFixed(6)+' zStd='+Math.sqrt(zVar).toFixed(6));
    }
   }
   else{
    // РАБОЧИЙ РЕЖИМ
    processSignal(bp,now);
   }
  }

  // Графики каждые 3 кадра
  if(frameNum%3===0){
   drawPPG(now);
   drawRaw();
  }

 }catch(e){
  log('ERR: '+e.message);
  console.error(e);
 }

 raf=requestAnimationFrame(loop);
}

// =========================================================================
//  ОБРАБОТКА СИГНАЛА + ДЕТЕКЦИЯ ПИКОВ
// =========================================================================
function processSignal(val, now){
 // Обновляем статистику (медленно)
 const a=0.008;
 zMean=zMean*(1-a)+val*a;
 zVar=zVar*(1-a)+(val-zMean)**2*a;
 const zStd=Math.sqrt(Math.max(zVar,1e-14));

 // Амплитуда
 sigAmp=sigAmp*.995+zStd*.005;
 ampL.textContent='amp:'+sigAmp.toExponential(2);

 // Проверка: есть ли вообще сигнал?
 if(sigAmp<MIN_AMP){
  stT.textContent=`⏳ Сигнал слабый — замрите, свет на лицо`;
  dot.className='dot w';
  return;
 }

 // Z-score
 const z=(val-zMean)/zStd;

 // Пик: z > порога, рефрактерный период, локальный максимум
 if(z>Z_THRESH && (now-lastPkT)>REFR_MS){
  const n=filtSig.length;
  if(n>=3){
   // Проверяем что предыдущий отсчёт был выше соседей (он и есть пик)
   const v0=filtSig[n-3], v1=filtSig[n-2], v2=filtSig[n-1];
   // Пик = v1 (один кадр назад)
   if(v1>=v0 && v1>=v2 && v1>zMean+zStd*1.0){
    // Нашли реальный пик!
    const ibi=lastPkT>0?(now-lastPkT):0;

    if(lastPkT>0 && ibi>=IBI_MIN && ibi<=IBI_MAX){
     realIBIs.push(ibi);
     if(realIBIs.length>60) realIBIs.shift();
     totalBeats++;
     log(`BEAT #${totalBeats}: IBI=${Math.round(ibi)}ms (${Math.round(60000/ibi)} BPM) z=${z.toFixed(1)}`);
    } else if(lastPkT>0){
     rejectedBeats++;
     log(`REJECT: IBI=${Math.round(ibi)}ms z=${z.toFixed(1)}`);
    }

    lastPkT=now;
    beatTs.push(now);
    while(beatTs.length>0 && now-beatTs[0]>30000) beatTs.shift();

    // Сердечко
    hrt.classList.add('beat');
    if(hrtTmr) clearTimeout(hrtTmr);
    hrtTmr=setTimeout(()=>hrt.classList.remove('beat'),150);

    if(ibi>=IBI_MIN && ibi<=IBI_MAX){
     bi.textContent=`💓 IBI: ${Math.round(ibi)}мс → ${Math.round(60000/ibi)} BPM`;
    }
   }
  }
 }

 // Обновление BPM
 updateBPM(now);
}

// =========================================================================
//  BPM — только из реальных IBI
// =========================================================================
function updateBPM(now){
 if(realIBIs.length<3){
  const needed=3-realIBIs.length;
  stT.textContent=`Накопление: ещё ${needed} удар(ов)...`;
  dot.className='dot w';
  return;
 }

 // Медиана последних 12 IBI
 const recent=realIBIs.slice(-12);
 const s=[...recent].sort((a,b)=>a-b);
 const med=s[Math.floor(s.length/2)];

 // Trimmed mean (убираем крайние)
 const trim=Math.max(1,Math.floor(s.length*.2));
 const t=s.slice(trim, s.length-trim);
 if(t.length===0) return;
 const avg=t.reduce((a,b)=>a+b,0)/t.length;
 const bpm=60000/avg;

 if(bpm<BPM_LO||bpm>BPM_HI){
  stT.textContent=`⚠ BPM вне диапазона (${Math.round(bpm)})`;
  dot.className='dot w';return;
 }

 if(isNaN(sBPM)) sBPM=bpm;
 else{
  const j=Math.abs(bpm-sBPM);
  const alpha=j>15?.05:j>8?.08:.07;
  sBPM=sBPM*(1-alpha)+bpm*alpha;
 }

 const dbpm=Math.round(sBPM);
 lastVBPM=dbpm; lastVT=now;
 vB.textContent=dbpm;
 vB.style.opacity='1';

 const b10=beatTs.filter(t=>now-t<10000).length;
 stT.textContent=`✅ ${dbpm} BPM · ${b10}/10с · beats:${totalBeats} rej:${rejectedBeats}`;
 dot.className='dot ok';

 calcHRV(dbpm);
}

function calcHRV(bpm){
 if(realIBIs.length<6) return;
 const s=[...realIBIs.slice(-20)].sort((a,b)=>a-b);
 const med=s[Math.floor(s.length/2)];
 const clean=realIBIs.filter(i=>i>=med*.65&&i<=med*1.35);
 if(clean.length<5) return;
 let ss=0,cn=0;
 for(let i=1;i<clean.length;i++){
  const d=clean[i]-clean[i-1];
  ss+=d*d;cn++;
 }
 if(!cn) return;
 const rmssd=Math.sqrt(ss/cn);
 if(isNaN(sHRV)) sHRV=rmssd; else sHRV=sHRV*.85+rmssd*.15;
 const hrv=Math.round(Math.max(5,Math.min(180,sHRV)));
 vH.textContent=hrv;

 let sb;
 if(bpm<=60)sb=5;else if(bpm<=70)sb=15;else if(bpm<=78)sb=25;
 else if(bpm<=86)sb=38;else if(bpm<=95)sb=52;else if(bpm<=105)sb=68;else sb=85;
 let sh;
 if(hrv>=80)sh=5;else if(hrv>=55)sh=18;else if(hrv>=40)sh=32;
 else if(hrv>=28)sh=48;else if(hrv>=18)sh=65;else sh=88;
 vS.textContent=Math.round(Math.max(5,Math.min(98,sb*.35+sh*.65)));
}

// =========================================================================
//  РИСОВАНИЕ
// =========================================================================
function drawROI(fx,fy,fw,fh,skinOk,ratio){
 co.clearRect(0,0,W,H);
 // Затемнение
 co.fillStyle='rgba(0,0,0,.3)';
 co.fillRect(0,0,W,H);
 co.clearRect(fx,fy,fw,fh);

 // Рамка лица
 const cl=skinOk?'#22c55e':'#ef4444';
 co.strokeStyle=cl;co.lineWidth=2;
 co.strokeRect(fx,fy,fw,fh);

 // Угловые маркеры
 const cn=12;
 co.lineWidth=3;co.strokeStyle=cl;
 co.beginPath();co.moveTo(fx,fy+cn);co.lineTo(fx,fy);co.lineTo(fx+cn,fy);co.stroke();
 co.beginPath();co.moveTo(fx+fw-cn,fy);co.lineTo(fx+fw,fy);co.lineTo(fx+fw,fy+cn);co.stroke();
 co.beginPath();co.moveTo(fx,fy+fh-cn);co.lineTo(fx,fy+fh);co.lineTo(fx+cn,fy+fh);co.stroke();
 co.beginPath();co.moveTo(fx+fw-cn,fy+fh);co.lineTo(fx+fw,fy+fh);co.lineTo(fx+fw,fy+fh-cn);co.stroke();

 // Фон (углы)
 co.strokeStyle='rgba(56,189,248,.35)';co.lineWidth=1;co.setLineDash([3,3]);
 for(const r of BG_ROIS){
  const bx=Math.floor(W*r.x),by=Math.floor(H*r.y),bw=Math.floor(W*r.w),bh=Math.floor(H*r.h);
  co.clearRect(bx,by,bw,bh);
  co.strokeRect(bx,by,bw,bh);
 }
 co.setLineDash([]);

 // Подписи
 co.font='bold 10px sans-serif';
 co.fillStyle=cl;
 co.fillText(skinOk?`✓ Кожа ${Math.round(ratio*100)}%`:`✗ Нет кожи (${Math.round(ratio*100)}%)`,fx+3,fy-4);
 co.fillStyle='rgba(56,189,248,.5)';
 co.font='9px sans-serif';
 co.fillText('фон',5,10);
}

function drawPPG(now){
 const w=cP.width=cP.clientWidth*2, h=cP.height=cP.clientHeight*2;
 xP.clearRect(0,0,w,h);

 if(filtSig.length<10){
  xP.fillStyle='#4b5563';xP.font='11px sans-serif';
  xP.fillText('Фильтрованный BVP сигнал...',10,h/2);
  return;
 }

 const show=Math.min(filtSig.length,Math.floor(fps*8));
 const sl=filtSig.slice(-show);
 let mn=1e9,mx=-1e9;
 for(const v of sl){if(v<mn)mn=v;if(v>mx)mx=v}
 const rng=mx-mn||1;

 // Порог z-score
 const zStd=Math.sqrt(Math.max(zVar,1e-14));
 const thr=zMean+zStd*Z_THRESH;
 const thrY=h-((thr-mn)/rng)*(h*.7)-h*.15;
 if(thrY>5&&thrY<h-5){
  xP.strokeStyle='rgba(239,68,68,.15)';xP.lineWidth=1;xP.setLineDash([3,3]);
  xP.beginPath();xP.moveTo(0,thrY);xP.lineTo(w,thrY);xP.stroke();xP.setLineDash([]);
  xP.fillStyle='rgba(239,68,68,.3)';xP.font='8px monospace';xP.fillText('z='+Z_THRESH,w-30,thrY-3);
 }

 // Волна
 xP.beginPath();xP.strokeStyle='#38bdf8';xP.lineWidth=1.5;
 for(let i=0;i<sl.length;i++){
  const px=i/(sl.length-1)*w;
  const py=h-((sl[i]-mn)/rng)*(h*.7)-h*.15;
  i===0?xP.moveTo(px,py):xP.lineTo(px,py);
 }
 xP.stroke();

 // Удары на графике
 const tStart=rawT.length>show?rawT[rawT.length-show]:(rawT[0]||0);
 const tEnd=rawT[rawT.length-1]||now;
 const tR=tEnd-tStart||1;
 for(const bt of beatTs){
  if(bt<tStart||bt>tEnd)continue;
  const px=((bt-tStart)/tR)*w;
  xP.fillStyle='rgba(239,68,68,.2)';
  xP.fillRect(px-1,0,2,h);
  xP.fillStyle='#ef4444';
  xP.beginPath();xP.arc(px,8,3,0,Math.PI*2);xP.fill();
 }

 xP.fillStyle='#555';xP.font='9px monospace';
 xP.fillText(`BVP filtered · beats:${totalBeats} · amp:${sigAmp.toExponential(1)}`,6,h-3);
}

function drawRaw(){
 const w=cR.width=cR.clientWidth*2, h=cR.height=cR.clientHeight*2;
 xR.clearRect(0,0,w,h);

 if(greenNorm.length<10){
  xR.fillStyle='#4b5563';xR.font='11px sans-serif';
  xR.fillText('Сырой G/BG...',10,h/2);
  return;
 }

 const show=Math.min(greenNorm.length,Math.floor(fps*8));
 const sl=greenNorm.slice(-show);
 let mn=1e9,mx=-1e9;
 for(const v of sl){if(v<mn)mn=v;if(v>mx)mx=v}
 const rng=mx-mn||1;

 xR.beginPath();xR.strokeStyle='#4ade80';xR.lineWidth=1.5;
 for(let i=0;i<sl.length;i++){
  const px=i/(sl.length-1)*w;
  const py=h-((sl[i]-mn)/rng)*(h*.7)-h*.15;
  i===0?xR.moveTo(px,py):xR.lineTo(px,py);
 }
 xR.stroke();

 xR.fillStyle='#555';xR.font='9px monospace';
 xR.fillText(`Raw G/Background · range: ${(mx-mn).toExponential(2)}`,6,h-3);
}
